":"Не терпится тебя увидеть."},{"id":"b1u53_11","en":"would rather","tr":"","ru":"предпочёл бы","exEn":"I'd rather stay at home.","exRu":"Я бы лучше остался дома."}]},{"id":"b1u54","tag":"Soc","title":"Общество","sub":"Население, выборы, права","words":[{"id":"b1u54_0","en":"society","tr":"","ru":"общество","exEn":"Technology changes society.","exRu":"Технологии меняют общество."},{"id":"b1u54_1","en":"community","tr":"","ru":"сообщество","exEn":"We have a strong local community.","exRu":"У нас сильное местное сообщество."},{"id":"b1u54_2","en":"population","tr":"","ru":"население","exEn":"The population of Novosibirsk is about 1.6 million.","exRu":"Население Новосибирска — около 1,6 миллиона."},{"id":"b1u54_3","en":"citizen","tr":"","ru":"гражданин","exEn":"Every citizen can vote.","exRu":"Каждый гражданин может голосовать."},{"id":"b1u54_4","en":"government","tr":"","ru":"правительство","exEn":"The government announced new rules.","exRu":"Правительство объявило новые правила."},{"id":"b1u54_5","en":"election","tr":"","ru":"выборы","exEn":"The election is in September.","exRu":"Выборы в сентябре."},{"id":"b1u54_6","en":"vote","tr":"","ru":"голосовать, голос","exEn":"Did you vote?","exRu":"Ты голосовал?"},{"id":"b1u54_7","en":"rights","tr":"","ru":"права","exEn":"Customers have rights.","exRu":"У покупателей есть права."},{"id":"b1u54_8","en":"freedom","tr":"","ru":"свобода","exEn":"I value my freedom.","exRu":"Я ценю свою свободу."},{"id":"b1u54_9","en":"equality","tr":"","ru":"равенство","exEn":"They fight for equality.","exRu":"Они борются за равенство."},{"id":"b1u54_10","en":"public","tr":"","ru":"общественный, публика","exEn":"The park is open to the public.","exRu":"Парк открыт для всех."},{"id":"b1u54_11","en":"local authorities","tr":"","ru":"местные власти","exEn":"The local authorities repaired the road.","exRu":"Местные власти отремонтировали дорогу."}]},{"id":"b1u55","tag":"Life","title":"Образ жизни","sub":"Баланс, выгорание, мотивация","words":[{"id":"b1u55_0","en":"lifestyle","tr":"","ru":"образ жизни","exEn":"I have a very active lifestyle.","exRu":"У меня очень активный образ жизни."},{"id":"b1u55_1","en":"work-life balance","tr":"","ru":"баланс работы и жизни","exEn":"Work-life balance is important.","exRu":"Баланс работы и жизни важен."},{"id":"b1u55_2","en":"routine","tr":"","ru":"распорядок, рутина","exEn":"I have a morning routine.","exRu":"У меня есть утренний ритуал."},{"id":"b1u55_3","en":"priority","tr":"","ru":"приоритет","exEn":"My family is my priority.","exRu":"Семья — мой приоритет."},{"id":"b1u55_4","en":"burnout","tr":"","ru":"выгорание","exEn":"Too much work leads to burnout.","exRu":"Слишком много работы ведёт к выгоранию."},{"id":"b1u55_5","en":"productive","tr":"","ru":"продуктивный","exEn":"I'm most productive in the morning.","exRu":"Утром я продуктивнее всего."},{"id":"b1u55_6","en":"procrastinate","tr":"","ru":"откладывать на потом","exEn":"Stop procrastinating!","exRu":"Хватит откладывать!"},{"id":"b1u55_7","en":"focus","tr":"","ru":"сосредоточиться; фокус","exEn":"I can't focus today.","exRu":"Сегодня не могу сосредоточиться."},{"id":"b1u55_8","en":"distraction","tr":"","ru":"отвлечение","exEn":"My phone is a big distraction.","exRu":"Телефон сильно отвлекает."},{"id":"b1u55_9","en":"motivation","tr":"","ru":"мотивация","exEn":"Where do you find motivation?","exRu":"Где ты берёшь мотивацию?"},{"id":"b1u55_10","en":"discipline","tr":"","ru":"дисциплина","exEn":"Discipline beats motivation.","exRu":"Дисциплина важнее мотивации."},{"id":"b1u55_11","en":"well-being","tr":"","ru":"благополучие","exEn":"We care about our employees' well-being.","exRu":"Мы заботимся о благополучии сотрудников."}]},{"id":"b1u56","tag":"Taste","title":"Вкусы","sub":"Предпочитать, увлечён, модный","words":[{"id":"b1u56_0","en":"prefer","tr":"","ru":"предпочитать","exEn":"I prefer working in the morning.","exRu":"Я предпочитаю работать утром."},{"id":"b1u56_1","en":"fond of","tr":"","ru":"любящий, неравнодушный к","exEn":"I'm fond of jazz.","exRu":"Я люблю джаз."},{"id":"b1u56_2","en":"keen on","tr":"","ru":"увлечённый","exEn":"He's keen on cycling.","exRu":"Он увлекается велоспортом."},{"id":"b1u56_3","en":"crazy about","tr":"","ru":"без ума от","exEn":"She's crazy about K-pop.","exRu":"Она без ума от кей-попа."},{"id":"b1u56_4","en":"into","tr":"","ru":"увлечён (разг.)","exEn":"I'm really into podcasts right now.","exRu":"Сейчас я очень увлечён подкастами."},{"id":"b1u56_5","en":"taste","tr":"","ru":"вкус","exEn":"We have the same taste in music.","exRu":"У нас одинаковый вкус в музыке."},{"id":"b1u56_6","en":"style","tr":"","ru":"стиль","exEn":"I like your style.","exRu":"Мне нравится твой стиль."},{"id":"b1u56_7","en":"fan","tr":"","ru":"фанат, болельщик","exEn":"I'm a big fan of this team.","exRu":"Я большой болельщик этой команды."},{"id":"b1u56_8","en":"genre","tr":"","ru":"жанр","exEn":"What's your favorite film genre?","exRu":"Какой твой любимый жанр кино?"},{"id":"b1u56_9","en":"trendy","tr":"","ru":"модный","exEn":"It's a trendy place.","exRu":"Это модное место."},{"id":"b1u56_10","en":"old-fashioned","tr":"","ru":"старомодный","exEn":"This design looks old-fashioned.","exRu":"Этот дизайн выглядит старомодно."},{"id":"b1u56_11","en":"mainstream","tr":"","ru":"массовый, мейнстрим","exEn":"It's not mainstream music.","exRu":"Это не массовая музыка."}]}],"text":{"title":"Офис или дом?","sub":"Колонка о работе","paras":["Personally, I enjoy working from home. I avoid wasting two hours a day in traffic, and I find it easier to focus on difficult tasks.","On the other hand, I miss talking to colleagues. Some ideas only appear when people are in the same room, and new employees struggle to learn the company culture online.","In my opinion, the best solution is a hybrid model. Our team decided to meet in the office twice a week and work remotely the rest of the time.","To be honest, it took a few months to get used to it, but now nobody wants to go back. It's worth trying if your work allows it."],"qs":[{"q":"Что автору нравится в работе из дома?","right":"Нет пробок и легче сосредоточиться","wrong":["Можно дольше спать","Выше зарплата"]},{"q":"Чего ему не хватает?","right":"Общения с коллегами","wrong":["Кофе в офисе","Быстрого интернета"]},{"q":"Какое решение он считает лучшим?","right":"Гибридную модель","wrong":["Только офис","Только удалёнку"]},{"q":"Как часто команда встречается в офисе?","right":"Два раза в неделю","wrong":["Каждый день","Раз в месяц"]}]}}]},{"id":"B2","name":"Upper-Intermediate","modules":[{"id":"b2m1","title":"Переговоры","colors":["#4c78ba","#213f6d"],"grammar":{"title":"Условные 3 типа и смешанные","text":"Третий тип — о прошлом, которое уже не изменить: If + Past Perfect, would have + третья форма. If we had signed earlier, we would have saved money. Смешанный тип: условие в прошлом, а результат сейчас: If I had learned English at school, I would be fluent now. Вместо would часто говорят could или might. В формальной речи if можно убрать: Had we known, we would have called.","ex":[["If we had known, we would have called you.","Если бы мы знали, мы бы вам позвонили."],["If I hadn't moved to Korea, I wouldn't speak Korean now.","Если бы я не переехал в Корею, я бы сейчас не говорил по-корейски."],["We might have won the deal if we had been faster.","Мы могли бы выиграть сделку, если бы были быстрее."]],"drills":[{"q":"If we ___ the offer, we would have lost the client.","ru":"Если бы мы отклонили предложение, мы бы потеряли клиента.","right":"had rejected","wrong":["rejected","would reject"]},{"q":"If she had called, I ___ helped her.","ru":"Если бы она позвонила, я бы ей помог.","right":"would have","wrong":["would","had"]},{"q":"If I ___ English earlier, I would have a better job now.","ru":"Если бы я выучил английский раньше, сейчас у меня была бы работа лучше.","right":"had learned","wrong":["learned","have learned"]},{"q":"We ___ have won if we had prepared better.","ru":"Мы могли бы победить, если бы лучше подготовились.","right":"might","wrong":["will","can"]},{"q":"If they hadn't lowered the price, we ___ signed.","ru":"Если бы они не снизили цену, мы бы не подписали.","right":"wouldn't have","wrong":["won't have","didn't"]},{"q":"If he ___ late, he wouldn't have missed the flight.","ru":"Если бы он не опоздал, он бы успел на рейс.","right":"hadn't been","wrong":["wasn't","wouldn't be"]},{"q":"If I had taken that job, I ___ live in Moscow now.","ru":"Если бы я согласился на ту работу, сейчас жил бы в Москве.","right":"would","wrong":["would have","will"]},{"q":"I wouldn't be so tired if I ___ worked all night.","ru":"Я бы не был так измотан, если бы не работал всю ночь.","right":"hadn't","wrong":["didn't","haven't"]}]},"units":[{"id":"b2u01","tag":"Deal","title":"Сделка и договор","sub":"Рычаг, пункт, нарушение","words":[{"id":"b2u01_0","en":"leverage","tr":"","ru":"рычаг влияния","exEn":"We have more leverage than they think.","exRu":"У нас больше рычагов давления, чем они думают."},{"id":"b2u01_1","en":"stakeholder","tr":"","ru":"заинтересованная сторона","exEn":"We need to involve all stakeholders.","exRu":"Нужно вовлечь все заинтересованные стороны."},{"id":"b2u01_2","en":"deal-breaker","tr":"","ru":"неприемлемое условие","exEn":"A long payment delay is a deal-breaker for us.","exRu":"Долгая отсрочка платежа для нас неприемлема."},{"id":"b2u01_3","en":"terms and conditions","tr":"","ru":"условия (договора)","exEn":"Please read the terms and conditions.","exRu":"Пожалуйста, ознакомьтесь с условиями."},{"id":"b2u01_4","en":"memorandum","tr":"","ru":"меморандум","exEn":"We signed a memorandum of understanding.","exRu":"Мы подписали меморандум о взаимопонимании."},{"id":"b2u01_5","en":"binding","tr":"","ru":"обязывающий","exEn":"This agreement is legally binding.","exRu":"Это соглашение имеет юридическую силу."},{"id":"b2u01_6","en":"clause","tr":"","ru":"пункт (договора)","exEn":"Let's look at clause five.","exRu":"Давайте посмотрим пятый пункт."},{"id":"b2u01_7","en":"breach","tr":"","ru":"нарушение","exEn":"That would be a breach of contract.","exRu":"Это было бы нарушением договора."},{"id":"b2u01_8","en":"renew","tr":"","ru":"продлевать","exEn":"We renewed the contract for another year.","exRu":"Мы продлили договор ещё на год."},{"id":"b2u01_9","en":"terminate","tr":"","ru":"расторгать, прекращать","exEn":"Either side can terminate the agreement.","exRu":"Любая сторона может расторгнуть соглашение."},{"id":"b2u01_10","en":"penalty","tr":"","ru":"штраф, неустойка","exEn":"There's a penalty for late delivery.","exRu":"За просрочку поставки предусмотрен штраф."},{"id":"b2u01_11","en":"liability","tr":"","ru":"ответственность (юридическая)","exEn":"We accept no liability for delays.","exRu":"Мы не несём ответственности за задержки."},{"id":"b2u01_12","en":"deadlock","tr":"","ru":"тупик","exEn":"The talks reached a deadlock.","exRu":"Переговоры зашли в тупик."},{"id":"b2u01_13","en":"mutual","tr":"","ru":"взаимный","exEn":"It's in our mutual interest.","exRu":"Это в наших общих интересах."},{"id":"b2u01_14","en":"finalize","tr":"","ru":"окончательно согласовать","exEn":"We'll finalize the details next week.","exRu":"Детали окончательно согласуем на следующей неделе."}]},{"id":"b2u02","tag":"Tact","title":"Тактика переговоров","sub":"Уступить, тянуть время, преимущество","words":[{"id":"b2u02_0","en":"anchor","tr":"","ru":"задать точку отсчёта","exEn":"Always anchor the price first.","exRu":"Всегда первым называй цену-ориентир."},{"id":"b2u02_1","en":"concede","tr":"","ru":"уступить, признать","exEn":"We conceded on the delivery date.","exRu":"Мы уступили в сроках поставки."},{"id":"b2u02_2","en":"push back","tr":"","ru":"возражать, сопротивляться","exEn":"The client pushed back on the price.","exRu":"Клиент возразил по цене."},{"id":"b2u02_3","en":"meet halfway","tr":"","ru":"пойти навстречу","exEn":"Can you meet us halfway?","exRu":"Можете пойти нам навстречу?"},{"id":"b2u02_4","en":"trade-off","tr":"","ru":"компромисс, размен","exEn":"There's always a trade-off between speed and quality.","exRu":"Между скоростью и качеством всегда приходится выбирать."},{"id":"b2u02_5","en":"put on the table","tr":"","ru":"выложить на стол, предложить","exEn":"Let's put all our options on the table.","exRu":"Давайте выложим все варианты на стол."},{"id":"b2u02_6","en":"hard sell","tr":"","ru":"агрессивная продажа","exEn":"Clients hate the hard sell.","exRu":"Клиенты ненавидят агрессивные продажи."},{"id":"b2u02_7","en":"pressure","tr":"","ru":"давление","exEn":"Don't sign under pressure.","exRu":"Не подписывай под давлением."},{"id":"b2u02_8","en":"bluff","tr":"","ru":"блефовать, блеф","exEn":"I think they're bluffing.","exRu":"Думаю, они блефуют."},{"id":"b2u02_9","en":"stall","tr":"","ru":"тянуть время","exEn":"They're stalling because they have no budget.","exRu":"Они тянут время, потому что у них нет бюджета."},{"id":"b2u02_10","en":"upper hand","tr":"","ru":"превосходство, верх","exEn":"Now we have the upper hand.","exRu":"Теперь преимущество у нас."},{"id":"b2u02_11","en":"on the same page","tr":"","ru":"на одной волне, одинаково понимать","exEn":"Let's make sure we're on the same page.","exRu":"Давайте убедимся, что мы одинаково всё понимаем."},{"id":"b2u02_12","en":"sticking point","tr":"","ru":"камень преткновения","exEn":"The price is the main sticking point.","exRu":"Главный камень преткновения — цена."},{"id":"b2u02_13","en":"ballpark figure","tr":"","ru":"примерная цифра","exEn":"Can you give me a ballpark figure?","exRu":"Можете назвать примерную цифру?"},{"id":"b2u02_14","en":"goodwill","tr":"","ru":"добрая воля, расположение","exEn":"We offered a discount as a gesture of goodwill.","exRu":"Мы предложили скидку в знак доброй воли."}]},{"id":"b2u03","tag":"Oops","title":"Взгляд назад","sub":"Задним числом, недооценить, предвидеть","words":[{"id":"b2u03_0","en":"in hindsight","tr":"","ru":"задним числом, оглядываясь назад","exEn":"In hindsight, we should have waited.","exRu":"Задним числом понятно, что стоило подождать."},{"id":"b2u03_1","en":"missed opportunity","tr":"","ru":"упущенная возможность","exEn":"It was a missed opportunity.","exRu":"Это была упущенная возможность."},{"id":"b2u03_2","en":"second thoughts","tr":"","ru":"сомнения","exEn":"I'm having second thoughts about the deal.","exRu":"У меня появились сомнения насчёт сделки."},{"id":"b2u03_3","en":"wrong call","tr":"","ru":"неверное решение","exEn":"Hiring him was the wrong call.","exRu":"Нанять его было неверным решением."},{"id":"b2u03_4","en":"lesson learned","tr":"","ru":"извлечённый урок","exEn":"Lesson learned: always check the contract.","exRu":"Урок усвоен: всегда проверяй договор."},{"id":"b2u03_5","en":"costly","tr":"","ru":"дорогостоящий","exEn":"It was a costly mistake.","exRu":"Это была дорогая ошибка."},{"id":"b2u03_6","en":"avoidable","tr":"","ru":"которого можно было избежать","exEn":"The delay was completely avoidable.","exRu":"Задержки можно было полностью избежать."},{"id":"b2u03_7","en":"reckless","tr":"","ru":"безрассудный","exEn":"That was a reckless decision.","exRu":"Это было безрассудное решение."},{"id":"b2u03_8","en":"cautious","tr":"","ru":"осторожный","exEn":"We're cautious about new markets.","exRu":"Мы осторожно относимся к новым рынкам."},{"id":"b2u03_9","en":"rush","tr":"","ru":"торопиться, спешка","exEn":"Don't rush into a decision.","exRu":"Не принимай решение второпях."},{"id":"b2u03_10","en":"overlook","tr":"","ru":"упустить из виду","exEn":"We overlooked an important detail.","exRu":"Мы упустили важную деталь."},{"id":"b2u03_11","en":"underestimate","tr":"","ru":"недооценивать","exEn":"Never underestimate your competitors.","exRu":"Никогда не недооценивай конкурентов."},{"id":"b2u03_12","en":"overestimate","tr":"","ru":"переоценивать","exEn":"We overestimated demand.","exRu":"Мы переоценили спрос."},{"id":"b2u03_13","en":"misjudge","tr":"","ru":"неверно оценить","exEn":"I misjudged the situation.","exRu":"Я неверно оценил ситуацию."},{"id":"b2u03_14","en":"foresee","tr":"","ru":"предвидеть","exEn":"Nobody could foresee the crisis.","exRu":"Никто не мог предвидеть кризис."}]},{"id":"b2u04","tag":"Law","title":"Право в бизнесе","sub":"Юрист, иск, конфиденциально","words":[{"id":"b2u04_0","en":"legal","tr":"","ru":"юридический, законный","exEn":"We need legal advice.","exRu":"Нам нужна юридическая консультация."},{"id":"b2u04_1","en":"illegal","tr":"","ru":"незаконный","exEn":"It's illegal to call people at night.","exRu":"Звонить людям ночью незаконно."},{"id":"b2u04_2","en":"lawyer","tr":"","ru":"юрист, адвокат","exEn":"Our lawyer checked the contract.","exRu":"Наш юрист проверил договор."},{"id":"b2u04_3","en":"court","tr":"","ru":"суд","exEn":"The case went to court.","exRu":"Дело дошло до суда."},{"id":"b2u04_4","en":"sue","tr":"","ru":"подать в суд","exEn":"They threatened to sue us.","exRu":"Они пригрозили подать на нас в суд."},{"id":"b2u04_5","en":"lawsuit","tr":"","ru":"судебный иск","exEn":"The lawsuit cost them millions.","exRu":"Иск обошёлся им в миллионы."},{"id":"b2u04_6","en":"settle","tr":"","ru":"урегулировать; поселиться","exEn":"We settled the dispute out of court.","exRu":"Мы урегулировали спор без суда."},{"id":"b2u04_7","en":"dispute","tr":"","ru":"спор, оспаривать","exEn":"There's a dispute about the payment.","exRu":"Есть спор по поводу оплаты."},{"id":"b2u04_8","en":"regulation","tr":"","ru":"норма, регулирование","exEn":"New regulations come into force in January.","exRu":"Новые нормы вступают в силу в январе."},{"id":"b2u04_9","en":"comply with","tr":"","ru":"соблюдать","exEn":"We comply with all data laws.","exRu":"Мы соблюдаем все законы о данных."},{"id":"b2u04_10","en":"copyright","tr":"","ru":"авторское право","exEn":"The music is protected by copyright.","exRu":"Музыка защищена авторским правом."},{"id":"b2u04_11","en":"trademark","tr":"","ru":"товарный знак","exEn":"We registered our trademark.","exRu":"Мы зарегистрировали товарный знак."},{"id":"b2u04_12","en":"confidential","tr":"","ru":"конфиденциальный","exEn":"This information is confidential.","exRu":"Эта информация конфиденциальна."},{"id":"b2u04_13","en":"NDA","tr":"","ru":"соглашение о неразглашении","exEn":"Please sign the NDA first.","exRu":"Сначала подпишите соглашение о неразглашении."},{"id":"b2u04_14","en":"jurisdiction","tr":"","ru":"юрисдикция","exEn":"Which jurisdiction applies?","exRu":"Какая юрисдикция применяется?"}]},{"id":"b2u05","tag":"Trust","title":"Доверие","sub":"Репутация, обязательство, подвести","words":[{"id":"b2u05_0","en":"rapport","tr":"","ru":"взаимопонимание, контакт","exEn":"She quickly built rapport with the client.","exRu":"Она быстро нашла контакт с клиентом."},{"id":"b2u05_1","en":"credibility","tr":"","ru":"доверие, авторитет","exEn":"The mistake hurt our credibility.","exRu":"Ошибка подорвала доверие к нам."},{"id":"b2u05_2","en":"track record","tr":"","ru":"послужной список","exEn":"They have a strong track record.","exRu":"У них отличный послужной список."},{"id":"b2u05_3","en":"commitment","tr":"","ru":"обязательство, преданность","exEn":"Thank you for your commitment.","exRu":"Спасибо за вашу преданность делу."},{"id":"b2u05_4","en":"follow through","tr":"","ru":"довести до конца","exEn":"He never follows through on his promises.","exRu":"Он никогда не выполняет обещания."},{"id":"b2u05_5","en":"consistent","tr":"","ru":"последовательный, стабильный","exEn":"The quality is consistent.","exRu":"Качество стабильное."},{"id":"b2u05_6","en":"accountable","tr":"","ru":"подотчётный, ответственный","exEn":"Managers are accountable for results.","exRu":"Менеджеры отвечают за результат."},{"id":"b2u05_7","en":"dependable","tr":"","ru":"надёжный (о человеке)","exEn":"She's the most dependable person on the team.","exRu":"Она самый надёжный человек в команде."},{"id":"b2u05_8","en":"genuine","tr":"","ru":"искренний, подлинный","exEn":"He showed genuine interest.","exRu":"Он проявил искренний интерес."},{"id":"b2u05_9","en":"build bridges","tr":"","ru":"налаживать отношения","exEn":"We need to build bridges with the new management.","exRu":"Нам нужно наладить отношения с новым руководством."},{"id":"b2u05_10","en":"burn bridges","tr":"","ru":"сжигать мосты","exEn":"Don't burn bridges when you leave a job.","exRu":"Не сжигай мосты, когда уходишь с работы."},{"id":"b2u05_11","en":"give the benefit of the doubt","tr":"","ru":"поверить на слово","exEn":"Let's give him the benefit of the doubt.","exRu":"Давай поверим ему на слово."},{"id":"b2u05_12","en":"keep your word","tr":"","ru":"держать слово","exEn":"Always keep your word.","exRu":"Всегда держи слово."},{"id":"b2u05_13","en":"let down","tr":"","ru":"подвести","exEn":"I won't let you down.","exRu":"Я тебя не подведу."},{"id":"b2u05_14","en":"betray","tr":"","ru":"предать","exEn":"He betrayed our trust.","exRu":"Он предал наше доверие."}]},{"id":"b2u06","tag":"Global","title":"Международный бизнес","sub":"Этикет, таможня, совместное предприятие","words":[{"id":"b2u06_0","en":"cross-cultural","tr":"","ru":"межкультурный","exEn":"Cross-cultural communication is a skill.","exRu":"Межкультурная коммуникация — это навык."},{"id":"b2u06_1","en":"etiquette","tr":"","ru":"этикет","exEn":"Business etiquette in Japan is strict.","exRu":"Деловой этикет в Японии строгий."},{"id":"b2u06_2","en":"lose face","tr":"","ru":"потерять лицо","exEn":"In Asia, nobody wants to lose face.","exRu":"В Азии никто не хочет потерять лицо."},{"id":"b2u06_3","en":"small talk","tr":"","ru":"светская беседа","exEn":"Small talk helps to break the ice.","exRu":"Светская беседа помогает растопить лёд."},{"id":"b2u06_4","en":"punctuality","tr":"","ru":"пунктуальность","exEn":"Punctuality is very important in Germany.","exRu":"В Германии очень важна пунктуальность."},{"id":"b2u06_5","en":"interpreter","tr":"","ru":"устный переводчик","exEn":"We hired an interpreter for the meeting.","exRu":"Мы наняли переводчика на встречу."},{"id":"b2u06_6","en":"overseas","tr":"","ru":"зарубежный, за рубежом","exEn":"We have many overseas clients.","exRu":"У нас много зарубежных клиентов."},{"id":"b2u06_7","en":"emerging market","tr":"","ru":"развивающийся рынок","exEn":"Vietnam is an emerging market.","exRu":"Вьетнам — развивающийся рынок."},{"id":"b2u06_8","en":"tariff","tr":"","ru":"пошлина, тариф","exEn":"New tariffs increased our costs.","exRu":"Новые пошлины увеличили наши расходы."},{"id":"b2u06_9","en":"sanctions","tr":"","ru":"санкции","exEn":"Sanctions changed many supply chains.","exRu":"Санкции изменили многие цепочки поставок."},{"id":"b2u06_10","en":"logistics","tr":"","ru":"логистика","exEn":"Logistics is our biggest challenge.","exRu":"Логистика — наша главная сложность."},{"id":"b2u06_11","en":"customs","tr":"","ru":"таможня","exEn":"The goods are stuck at customs.","exRu":"Товар застрял на таможне."},{"id":"b2u06_12","en":"globalization","tr":"","ru":"глобализация","exEn":"Globalization has changed retail.","exRu":"Глобализация изменила розничную торговлю."},{"id":"b2u06_13","en":"localize","tr":"","ru":"локализовать","exEn":"We localized the app for Kazakhstan.","exRu":"Мы локализовали приложение для Казахстана."},{"id":"b2u06_14","en":"joint venture","tr":"","ru":"совместное предприятие","exEn":"They set up a joint venture in China.","exRu":"Они создали совместное предприятие в Китае."}]},{"id":"b2u07","tag":"Calm","title":"Конфликты","sub":"Напряжение, посредник, общий язык","words":[{"id":"b2u07_0","en":"conflict","tr":"","ru":"конфликт","exEn":"We try to avoid conflict.","exRu":"Мы стараемся избегать конфликтов."},{"id":"b2u07_1","en":"tension","tr":"","ru":"напряжённость","exEn":"There's tension between the two teams.","exRu":"Между двумя командами напряжение."},{"id":"b2u07_2","en":"resentment","tr":"","ru":"обида, негодование","exEn":"He still feels resentment.","exRu":"Он до сих пор обижен."},{"id":"b2u07_3","en":"grievance","tr":"","ru":"претензия, жалоба","exEn":"Employees can raise grievances with HR.","exRu":"Сотрудники могут подавать жалобы в отдел кадров."},{"id":"b2u07_4","en":"mediate","tr":"","ru":"быть посредником","exEn":"Can you mediate between them?","exRu":"Можешь стать посредником между ними?"},{"id":"b2u07_5","en":"mediator","tr":"","ru":"посредник","exEn":"We invited a neutral mediator.","exRu":"Мы пригласили нейтрального посредника."},{"id":"b2u07_6","en":"de-escalate","tr":"","ru":"снизить накал","exEn":"Her calm voice helped to de-escalate the situation.","exRu":"Её спокойный голос помог разрядить обстановку."},{"id":"b2u07_7","en":"confront","tr":"","ru":"поговорить начистоту, противостоять","exEn":"I had to confront him about the delays.","exRu":"Мне пришлось поговорить с ним начистоту о задержках."},{"id":"b2u07_8","en":"clear the air","tr":"","ru":"прояснить отношения","exEn":"Let's meet and clear the air.","exRu":"Давай встретимся и всё проясним."},{"id":"b2u07_9","en":"common ground","tr":"","ru":"точки соприкосновения","exEn":"We found some common ground.","exRu":"Мы нашли точки соприкосновения."},{"id":"b2u07_10","en":"agree to disagree","tr":"","ru":"остаться каждый при своём мнении","exEn":"Let's agree to disagree.","exRu":"Давай останемся каждый при своём мнении."},{"id":"b2u07_11","en":"hostile","tr":"","ru":"враждебный","exEn":"The atmosphere was hostile.","exRu":"Атмосфера была враждебной."},{"id":"b2u07_12","en":"defensive","tr":"","ru":"занимающий оборону","exEn":"Don't get defensive, it's just feedback.","exRu":"Не защищайся, это просто обратная связь."},{"id":"b2u07_13","en":"constructive","tr":"","ru":"конструктивный","exEn":"It was a constructive discussion.","exRu":"Это было конструктивное обсуждение."},{"id":"b2u07_14","en":"apologetic","tr":"","ru":"извиняющийся","exEn":"He was very apologetic about the mistake.","exRu":"Он очень извинялся за ошибку."}]}],"text":{"title":"Сделка, которую мы упустили","sub":"Разбор неудачных переговоров","paras":["Last spring we lost a contract we really wanted. A large logistics company was choosing between us and a Moscow agency, and in the end they went with our competitor.","In hindsight, the mistakes are obvious. If we had done proper research on the stakeholders, we would have known that their finance director, not the marketing team, made the final decision. If we had prepared a ballpark figure in advance, we wouldn't have looked so uncertain when he asked about the budget.","The biggest sticking point was the penalty clause. They wanted strict penalties for missed deadlines, and we pushed back too hard. Had we met them halfway, we might have signed the deal.","It was a costly lesson, but a useful one. We would probably be working with them today if we had been less defensive. Now we always map the decision makers before the first call."],"qs":[{"q":"Кто на самом деле принимал решение?","right":"Финансовый директор","wrong":["Отдел маркетинга","Владелец агентства"]},{"q":"Чего не хватило на встрече?","right":"Заранее подготовленной примерной цифры","wrong":["Презентации","Переводчика"]},{"q":"Что стало камнем преткновения?","right":"Пункт о штрафах","wrong":["Сроки оплаты","Дизайн логотипа"]},{"q":"Что команда делает теперь?","right":"Заранее определяет, кто принимает решения","wrong":["Отказывается от крупных клиентов","Не обсуждает бюджет"]}]}},{"id":"b2m2","title":"Презентации","colors":["#3d8a8f","#1d4a5a"],"grammar":{"title":"Связки: however, although, despite, whereas","text":"Связки делают речь логичной. Противопоставление: however (в начале нового предложения), although (+ целое предложение), despite и in spite of (+ существительное или -ing), whereas (сравнение двух фактов). Причина и следствие: therefore, as a result, due to, consequently. Добавление: moreover, furthermore, in addition. Не говорите despite of — правильно despite или in spite of.","ex":[["Although the budget was small, the campaign was a success.","Хотя бюджет был небольшим, кампания оказалась успешной."],["Sales fell; however, profit grew.","Продажи упали, однако прибыль выросла."],["Due to high demand, delivery may take longer.","Из-за высокого спроса доставка может занять больше времени."]],"drills":[{"q":"___ the high price, the product sold well.","ru":"Несмотря на высокую цену, продукт хорошо продавался.","right":"Despite","wrong":["Although","However"]},{"q":"___ it was raining, we went out.","ru":"Хотя шёл дождь, мы вышли.","right":"Although","wrong":["Despite","However"]},{"q":"Sales fell. ___, profit increased.","ru":"Продажи упали. Однако прибыль выросла.","right":"However","wrong":["Although","Despite"]},{"q":"Our costs rose. ___, we raised prices.","ru":"Наши расходы выросли. Поэтому мы подняли цены.","right":"Therefore","wrong":["Moreover","Whereas"]},{"q":"The project was delayed ___ technical problems.","ru":"Проект задержался из-за технических проблем.","right":"due to","wrong":["because","therefore"]},{"q":"Moscow is expensive, ___ Novosibirsk is cheaper.","ru":"Москва дорогая, тогда как Новосибирск дешевле.","right":"whereas","wrong":["despite","therefore"]},{"q":"The app is fast. ___, it's free.","ru":"Приложение быстрое. Более того, оно бесплатное.","right":"Moreover","wrong":["However","Although"]},{"q":"In spite ___ the crisis, we grew.","ru":"Несмотря на кризис, мы выросли.","right":"of","wrong":["from","for"]}]},"units":[{"id":"b2u08","tag":"Link","title":"Связки 1","sub":"Однако, хотя, следовательно","words":[{"id":"b2u08_0","en":"however","tr":"","ru":"однако","exEn":"However, the results were good.","exRu":"Однако результаты были хорошими."},{"id":"b2u08_1","en":"although","tr":"","ru":"хотя","exEn":"Although it was late, we kept working.","exRu":"Хотя было поздно, мы продолжали работать."},{"id":"b2u08_2","en":"despite","tr":"","ru":"несмотря на","exEn":"Despite the rain, the event was a success.","exRu":"Несмотря на дождь, мероприятие удалось."},{"id":"b2u08_3","en":"whereas","tr":"","ru":"тогда как","exEn":"I prefer email, whereas he prefers calls.","exRu":"Я предпочитаю почту, а он — звонки."},{"id":"b2u08_4","en":"therefore","tr":"","ru":"поэтому, следовательно","exEn":"The data is old; therefore, we need new research.","exRu":"Данные устарели, поэтому нужно новое исследование."},{"id":"b2u08_5","en":"consequently","tr":"","ru":"следовательно, в итоге","exEn":"Prices rose; consequently, demand fell.","exRu":"Цены выросли, и в итоге спрос упал."},{"id":"b2u08_6","en":"as a result","tr":"","ru":"в результате","exEn":"As a result, we lost two clients.","exRu":"В результате мы потеряли двух клиентов."},{"id":"b2u08_7","en":"due to","tr":"","ru":"из-за, благодаря","exEn":"The flight was cancelled due to bad weather.","exRu":"Рейс отменили из-за плохой погоды."},{"id":"b2u08_8","en":"moreover","tr":"","ru":"более того","exEn":"Moreover, the service is free.","exRu":"Более того, сервис бесплатный."},{"id":"b2u08_9","en":"furthermore","tr":"","ru":"более того, кроме того (формально)","exEn":"Furthermore, we offer a guarantee.","exRu":"Кроме того, мы даём гарантию."},{"id":"b2u08_10","en":"nevertheless","tr":"","ru":"тем не менее","exEn":"It was risky; nevertheless, we did it.","exRu":"Это было рискованно, но мы всё же сделали это."},{"id":"b2u08_11","en":"in spite of","tr":"","ru":"несмотря на (= despite)","exEn":"In spite of the crisis, we hired three people.","exRu":"Несмотря на кризис, мы наняли трёх человек."},{"id":"b2u08_12","en":"thus","tr":"","ru":"таким образом","exEn":"Thus, costs fell by ten percent.","exRu":"Таким образом, расходы снизились на десять процентов."},{"id":"b2u08_13","en":"hence","tr":"","ru":"отсюда, поэтому","exEn":"The product is new, hence the high price.","exRu":"Продукт новый, отсюда высокая цена."},{"id":"b2u08_14","en":"instead","tr":"","ru":"вместо этого","exEn":"We didn't hire anyone; instead, we automated the process.","exRu":"Мы никого не наняли, а вместо этого автоматизировали процесс."}]},{"id":"b2u09","tag":"Link2","title":"Связки 2","sub":"С точки зрения, например, в целом","words":[{"id":"b2u09_0","en":"in terms of","tr":"","ru":"с точки зрения","exEn":"In terms of price, we're the best option.","exRu":"С точки зрения цены мы лучший вариант."},{"id":"b2u09_1","en":"with regard to","tr":"","ru":"что касается","exEn":"With regard to delivery, there's a small delay.","exRu":"Что касается доставки, есть небольшая задержка."},{"id":"b2u09_2","en":"as for","tr":"","ru":"а что до, насчёт","exEn":"As for me, I'm ready to start.","exRu":"Что касается меня, я готов начинать."},{"id":"b2u09_3","en":"in contrast","tr":"","ru":"напротив, в отличие","exEn":"In contrast, our costs went down.","exRu":"Наши же расходы, напротив, снизились."},{"id":"b2u09_4","en":"similarly","tr":"","ru":"аналогично","exEn":"Similarly, the second campaign was a success.","exRu":"Аналогично, вторая кампания тоже удалась."},{"id":"b2u09_5","en":"likewise","tr":"","ru":"так же, точно так же","exEn":"He was polite, and I did likewise.","exRu":"Он был вежлив, и я ответил тем же."},{"id":"b2u09_6","en":"for instance","tr":"","ru":"например","exEn":"For instance, we use Telegram bots.","exRu":"Например, мы используем телеграм-ботов."},{"id":"b2u09_7","en":"such as","tr":"","ru":"такой как","exEn":"We work with industries such as oil and logistics.","exRu":"Мы работаем с такими отраслями, как нефть и логистика."},{"id":"b2u09_8","en":"namely","tr":"","ru":"а именно","exEn":"We have one problem, namely the budget.","exRu":"У нас одна проблема, а именно бюджет."},{"id":"b2u09_9","en":"in particular","tr":"","ru":"в частности","exEn":"I liked the design in particular.","exRu":"Мне особенно понравился дизайн."},{"id":"b2u09_10","en":"above all","tr":"","ru":"прежде всего","exEn":"Above all, be honest with clients.","exRu":"Прежде всего будь честен с клиентами."},{"id":"b2u09_11","en":"overall","tr":"","ru":"в целом","exEn":"Overall, it was a good year.","exRu":"В целом это был хороший год."},{"id":"b2u09_12","en":"to sum up","tr":"","ru":"подводя итог","exEn":"To sum up, the project is on track.","exRu":"Подводя итог, проект идёт по плану."},{"id":"b2u09_13","en":"in other words","tr":"","ru":"другими словами","exEn":"In other words, we need more time.","exRu":"Другими словами, нам нужно больше времени."},{"id":"b2u09_14","en":"as a matter of fact","tr":"","ru":"на самом деле, фактически","exEn":"As a matter of fact, I've already called him.","exRu":"Вообще-то я ему уже позвонил."}]},{"id":"b2u10","tag":"Slide","title":"Презентация","sub":"Слайд, вывод, репетиция","words":[{"id":"b2u10_0","en":"slide","tr":"","ru":"слайд","exEn":"Let's move to the next slide.","exRu":"Перейдём к следующему слайду."},{"id":"b2u10_1","en":"chart","tr":"","ru":"диаграмма","exEn":"This chart shows our growth.","exRu":"Эта диаграмма показывает наш рост."},{"id":"b2u10_2","en":"graph","tr":"","ru":"график","exEn":"The graph goes up every month.","exRu":"График растёт каждый месяц."},{"id":"b2u10_3","en":"bullet point","tr":"","ru":"пункт списка","exEn":"Keep it to three bullet points per slide.","exRu":"Не больше трёх пунктов на слайде."},{"id":"b2u10_4","en":"handout","tr":"","ru":"раздаточный материал","exEn":"I'll send the handouts after the meeting.","exRu":"Я пришлю раздаточные материалы после встречи."},{"id":"b2u10_5","en":"key takeaway","tr":"","ru":"главный вывод","exEn":"What's the key takeaway?","exRu":"Какой главный вывод?"},{"id":"b2u10_6","en":"Q&A","tr":"","ru":"вопросы и ответы","exEn":"We'll have ten minutes for Q&A.","exRu":"На вопросы и ответы будет десять минут."},{"id":"b2u10_7","en":"visual","tr":"","ru":"визуальный материал, визуальный","exEn":"Use more visuals and less text.","exRu":"Больше визуала, меньше текста."},{"id":"b2u10_8","en":"structure","tr":"","ru":"структура","exEn":"The structure of the talk is simple.","exRu":"Структура выступления простая."},{"id":"b2u10_9","en":"outline","tr":"","ru":"план; кратко изложить","exEn":"Let me outline the main points.","exRu":"Позвольте кратко изложить основные пункты."},{"id":"b2u10_10","en":"rehearse","tr":"","ru":"репетировать","exEn":"I rehearsed the pitch five times.","exRu":"Я репетировал питч пять раз."},{"id":"b2u10_11","en":"engage","tr":"","ru":"вовлекать","exEn":"Ask questions to engage the audience.","exRu":"Задавайте вопросы, чтобы вовлечь аудиторию."},{"id":"b2u10_12","en":"keynote","tr":"","ru":"главный доклад","exEn":"She gave the keynote at the conference.","exRu":"Она выступила с главным докладом на конференции."},{"id":"b2u10_13","en":"speaker","tr":"","ru":"спикер, докладчик; динамик","exEn":"The next speaker is from Seoul.","exRu":"Следующий спикер из Сеула."},{"id":"b2u10_14","en":"stage fright","tr":"","ru":"страх сцены","exEn":"I still have stage fright.","exRu":"У меня до сих пор страх сцены."}]},{"id":"b2u11","tag":"Data","title":"Цифры и динамика","sub":"Процент, пик, резко упасть","words":[{"id":"b2u11_0","en":"figure","tr":"","ru":"цифра; фигура","exEn":"The figures look good.","exRu":"Цифры выглядят хорошо."},{"id":"b2u11_1","en":"statistics","tr":"","ru":"статистика","exEn":"The statistics are clear.","exRu":"Статистика однозначна."},{"id":"b2u11_2","en":"percentage","tr":"","ru":"процент, доля","exEn":"What percentage of clients came back?","exRu":"Какой процент клиентов вернулся?"},{"id":"b2u11_3","en":"average","tr":"","ru":"средний, в среднем","exEn":"The average check is two thousand rubles.","exRu":"Средний чек — две тысячи рублей."},{"id":"b2u11_4","en":"majority","tr":"","ru":"большинство","exEn":"The majority of users are women.","exRu":"Большинство пользователей — женщины."},{"id":"b2u11_5","en":"minority","tr":"","ru":"меньшинство","exEn":"Only a minority complained.","exRu":"Пожаловалось лишь меньшинство."},{"id":"b2u11_6","en":"proportion","tr":"","ru":"доля, пропорция","exEn":"A large proportion of sales comes from repeat clients.","exRu":"Большая доля продаж приходится на повторных клиентов."},{"id":"b2u11_7","en":"peak","tr":"","ru":"пик, достигать пика","exEn":"Sales peak in December.","exRu":"Пик продаж приходится на декабрь."},{"id":"b2u11_8","en":"fluctuate","tr":"","ru":"колебаться (о цифрах) удим это подробно."},{"id":"b2u14_14","en":"data-driven","tr":"","ru":"основанный на данных","exEn":"We make data-driven decisions.","exRu":"Мы принимаем решения на основе данных."}]}],"text":{"title":"Итоги кампании","sub":"Фрагмент выступления","paras":["Good morning, everyone. Today I'd like to talk about the results of our autumn campaign and, above all, what we've learned from it.","Overall, the figures are encouraging. Website traffic soared by sixty percent year-on-year, and conversion rose to 3.2 percent, whereas the industry benchmark is around two. However, the cost per lead was higher than we expected, mainly due to rising advertising prices.","In terms of channels, Telegram outperformed everything else. In contrast, banner ads plummeted after the first two weeks. Therefore, we recommend moving most of the budget to Telegram and video content.","To sum up: the campaign was a success, but in spite of the strong results, we need to keep an eye on costs. Moreover, I'd suggest testing autodial campaigns for older audiences. Now I'm happy to take your questions."],"qs":[{"q":"На сколько вырос трафик сайта?","right":"На шестьдесят процентов","wrong":["На двадцать процентов","Вдвое"]},{"q":"Какая конверсия была у кампании?","right":"3,2%","wrong":["2%","6%"]},{"q":"Что оказалось дороже ожиданий?","right":"Стоимость лида","wrong":["Зарплаты","Аренда"]},{"q":"Куда предлагают перенести бюджет?","right":"В Телеграм и видео","wrong":["В баннеры","В печатную рекламу"]}]}},{"id":"b2m3","title":"Маркетинг и бренд","colors":["#6a63b0","#2e2c6a"],"grammar":{"title":"Сложный пассив и have something done","text":"Безличный пассив передаёт мнения и слухи: It is said that…, It is believed that…, или короче: The company is said to be the leader. Если речь о прошлом: is said to have done. Каузатив have или get something done — работу делает кто-то другой по вашему заказу: We had our logo redesigned. I'm getting my car fixed.","ex":[["It is believed that the brand will grow.","Считается, что бренд будет расти."],["The company is said to be the market leader.","Говорят, что компания — лидер рынка."],["We had our website redesigned last year.","В прошлом году нам переделали сайт."]],"drills":[{"q":"It ___ that the new model will be cheaper.","ru":"Говорят, что новая модель будет дешевле.","right":"is said","wrong":["says","is saying"]},{"q":"The CEO is believed ___ the company soon.","ru":"Считается, что гендиректор скоро уйдёт.","right":"to leave","wrong":["leaving","leave"]},{"q":"We had our logo ___ by a famous studio.","ru":"Нам сделала логотип известная студия.","right":"designed","wrong":["design","to design"]},{"q":"I need to get my laptop ___.","ru":"Мне нужно отдать ноутбук в ремонт.","right":"repaired","wrong":["repair","repairing"]},{"q":"The brand is thought ___ the best in its niche.","ru":"Бренд считается лучшим в своей нише.","right":"to be","wrong":["being","be"]},{"q":"It ___ expected that prices will rise.","ru":"Ожидается, что цены вырастут.","right":"is","wrong":["has","does"]},{"q":"She's having her office ___ next week.","ru":"На следующей неделе ей красят офис.","right":"painted","wrong":["paint","to paint"]},{"q":"The campaign is reported ___ two million people.","ru":"Сообщается, что кампания охватила два миллиона человек.","right":"to have reached","wrong":["reached","reaching"]}]},"units":[{"id":"b2u15","tag":"Brand","title":"Бренд","sub":"Позиционирование, восприятие, миссия","words":[{"id":"b2u15_0","en":"brand identity","tr":"","ru":"айдентика бренда","exEn":"We created a new brand identity.","exRu":"Мы создали новую айдентику бренда."},{"id":"b2u15_1","en":"positioning","tr":"","ru":"позиционирование","exEn":"Our positioning is \"fast and friendly\".","exRu":"Наше позиционирование — «быстро и по-дружески»."},{"id":"b2u15_2","en":"logo","tr":"","ru":"логотип","exEn":"The logo is simple and clean.","exRu":"Логотип простой и чистый."},{"id":"b2u15_3","en":"brand voice","tr":"","ru":"голос бренда, манера общения","  office cleaned before the meeting.","exRu":"Перед встречей нам убрали офис."},{"id":"b2u21_1","en":"get something fixed","tr":"","ru":"починить (у мастера)","exEn":"I need to get my phone fixed.","exRu":"Мне нужно отдать телефон в ремонт."},{"id":"b2u21_2","en":"renovate","tr":"","ru":"ремонтировать (помещение)","exEn":"We renovated the office last summer.","exRu":"Прошлым летом мы сделали ремонт в офисе."},{"id":"b2u21_3","en":"redecorate","tr":"","ru":"сделать косметический ремонт","exEn":"We're redecorating the meeting room.","exRu":"Мы обновляем переговорную."},{"id":"b2u21_4","en":"tailor-made","tr":"","ru":"сделанный под заказ, индивидуальный","exEn":"We offer tailor-made solutions.","exRu":"Мы предлагаем индивидуальные решения."},{"id":"b2u21_5","en":"bespoke","tr":"","ru":"изготовленный на заказ","exEn":"He wears a bespoke suit.","exRu":"Он носит костюм, сшитый на заказ."},{"id":"b2u21_6","en":"custom-made","tr":"","ru":"сделанный на заказ","exEn":"The furniture is custom-made.","exRu":"Мебель сделана на заказ."},{"id":"b2u21_7","en":"maintenance","tr":"","ru":"обслуживание","exEn":"The price includes maintenance.","exRu":"Цена включает обслуживание."},{"id":"b2u21_8","en":"upgrade","tr":"","ru":"улучшить, обновить","exEn":"We upgraded our plan.","exRu":"Мы перешли на тариф выше."},{"id":"b2u21_9","en":"assemble","tr":"","ru":"собирать","exEn":"The furniture is easy to assemble.","exRu":"Мебель легко собрать."},{"id":"b2u21_10","en":"professional","tr":"","ru":"профессионал, профессиональный","exEn":"Leave it to the professionals.","exRu":"Доверьте это профессионалам."},{"id":"b2u21_11","en":"DIY","tr":"","ru":"сделай сам","exEn":"I'm not a fan of DIY.","exRu":"Я не любитель делать всё своими руками."},{"id":"b2u21_12","en":"handyman","tr":"","ru":"мастер на все руки","exEn":"We called a handyman to fix the door.","exRu":"Мы вызвали мастера починить дверь."},{"id":"b2u21_13","en":"craftsman","tr":"","ru":"мастер, ремесленник","exEn":"Every bag is made by a  meeting.","ru":"Он не отвечает. Наверняка он на встрече.","right":"must","wrong":["can't","should"]},{"q":"They ___ have finished already, it's a huge project.","ru":"Не может быть, чтобы они уже закончили, это огромный проект.","right":"can't","wrong":["must","should"]},{"q":"She ___ have missed my email; it went to spam.","ru":"Возможно, она не увидела моё письмо, оно попало в спам.","right":"might","wrong":["mustn't","can"]},{"q":"You ___ have told me earlier!","ru":"Надо было сказать мне раньше!","right":"should","wrong":["must","might"]},{"q":"The office is dark. Everyone ___ gone home.","ru":"В офисе темно. Все, должно быть, ушли домой.","right":"must have","wrong":["can't have","should"]},{"q":"I'm not sure where he is. He ___ be at lunch.","ru":"Не знаю, где он. Может быть, на обеде.","right":"might","wrong":["must","can't"]},{"q":"We ___ have hired him; he was terrible.","ru":"Не стоило его нанимать, он был ужасен.","right":"shouldn't","wrong":["can't","mustn't"]},{"q":"He ___ have been there; I saw him in Moscow that day.","ru":"Его не могло там быть: я видел его в тот день в Москве.","right":"can't","wrong":["must","should"]}]},"units":[{"id":"b2u29","tag":"Logic","title":"Логика","sub":"Рассуждение, противоречие, предвзятость","words":[{"id":"b2u29_0","en":"logical","tr":"","ru":"логичный","exEn":"It's the logical next step.","exRu":"Это логичный следующий шаг."},{"id":"b2u29_1","en":"reasoning","tr":"","ru":"рассуждение, логика","exEn":"I don't follow your reasoning.","exRu":"Я не понимаю хода твоих рассуждений."},{"id":"b2u29_2","en":"premise","tr":"","ru":"предпосылка, исходное положение","exEn":"The whole plan is based on a false premise.","exRu":"Весь план основан на ложной предпосылке."},{"id":"b2u29_3","en":"deduce","tr":"","ru":"делать вывод","exEn":"What can we deduce from the data?","exRu":"Какой вывод можно сделать из данных?"},{"id":"b2u29_4","en":"infer","tr":"","ru":"заключать, подразумевать","exEn":"I infer from his email that he's unhapp ","exRu":"Мы нашли обходной путь."},{"id":"b2u35_3","en":"setback","tr":"","ru":"неудача, откат назад","exEn":"It was a temporary setback.","exRu":"Это была временная неудача."},{"id":"b2u35_4","en":"obstacle","tr":"","ru":"препятствие","exEn":"The main obstacle is money.","exRu":"Главное препятствие — деньги."},{"id":"b2u35_5","en":"dilemma","tr":"","ru":"дилемма","exEn":"We face a difficult dilemma.","exRu":"Перед нами трудная дилемма."},{"id":"b2u35_6","en":"prioritize","tr":"","ru":"расставлять приоритеты","exEn":"You need to prioritize your tasks.","exRu":"Тебе нужно расставить приоритеты в задачах."},{"id":"b2u35_7","en":"tackle","tr":"","ru":"браться за (проблему)","exEn":"Let's tackle the biggest problem first.","exRu":"Давай сначала возьмёмся за самую большую проблему."},{"id":"b2u35_8","en":"mitigate","tr":"","ru":"смягчать, снижать (риск)","exEn":"How can we mitigate the risk?","exRu":"Как мы можем снизить риск?"},{"id":"b2u35_9","en":"contingency plan","tr":"","ru":"план на случай непредвиденного","exEn":"Do we have a contingency plan?","exRu":"У нас есть план на непредвиденный случай?"},{"id":"b2u35_10","en":"trial and error","tr":"","ru":"метод проб и ошибок","exEn":"We learned it by trial and error.","exRu":"Мы научились этому методом проб и ошибок."},{"id":"b2u35_11","en":"quick fix","tr":"","ru":"быстрое решение (временное)","exEn":"There's no quick fix for this.","exRu":"Быстрого решения здесь нет."},{"id":"b2u35_12","en":"pinpoint","tr":"","ru":"точно определить","exEn":"We pinpointed the cause of the problem.","exRu":"Мы точно определили причину проблемы."},{"id":"b2u35_13","en":"pragmatic","tr":"","ru":"прагматичный","exEn":"Let's take a pragmatic approach.","exRu":"Давай подойдём к этому прагматично."},{"id":"b2u35_14","en":"hands-on","tr":"","ru":"практический, непосредственный","exEn":"He's a very hands-on manager.","exRu":"Он руководитель, который сам во всё вникает."}]}],"text":{"title":"Куда делись заявки?","sub":"Разбор одного понедельника","paras":["On Monday morning our sales team noticed something strange: the number of new leads had dropped by eighty percent over the weekend, although the advertising budget hadn't changed.","At first, everyone had a theory. The designer thought the ads must have been blocked. The sales manager said competitors might have lowered their prices. Someone even suggested that the market must be saturated.","But the analytics told a different story. Traffic hadn't changed at all, so the ads can't have been blocked. People were visiting the landing page and leaving. The root cause turned out to be simple: a developer had updated the website on Friday, and the contact form had stopped working.","We should have tested the form after the update. Now every release goes through a short checklist, and we get an alert if leads drop by more than thirty percent in a day."],"qs":[{"q":"Что случилось с заявками?","right":"Упали на 80% за выходные","wrong":["Выросли вдвое","Перестали приходить на почту клиента"]},{"q":"Почему рекламу не могли заблокировать?","right":"Трафик не изменился","wrong":["Дизайнер это проверил","Бюджет вырос"]},{"q":"В чём была настоящая причина?","right":"После обновления сайта перестала работать форма заявки","wrong":["Конкуренты снизили цены","Рынок насытился"]},{"q":"Что команда делает теперь?","right":"Проверяет каждый релиз по чек-листу и следит за падением заявок","wrong":["Больше не обновляет сайт","Увеличила бюджет"]}]}},{"id":"b2m6","title":"Команда и лидерство","colors":["#8a5a9c","#43275a"],"grammar":{"title":"wish и if only","text":"wish + Past Simple — сожаление о настоящем: I wish I had more time. wish + Past Perfect — сожаление о прошлом: I wish I had hired her. wish + would — раздражение от чужого поведения или желание, чтобы кто-то изменился: I wish he would reply. If only — то же самое, только эмоциональнее. В формальной речи после wish говорят were: I wish I were there.","ex":[["I wish I spoke Korean better.","Жаль, что я не говорю по-корейски лучше."],["If only we had started earlier!","Если бы только мы начали раньше!"],["I wish my colleagues would stop being late.","Хоть бы коллеги перестали опаздывать."]],"drills":[{"q":"I wish I ___ more time for sport.","ru":"Жаль, что у меня мало времени на спорт.","right":"had","wrong":["have","would have"]},{"q":"I wish I ___ that job offer last year.","ru":"Жаль, что я не принял то предложение в прошлом году.","right":"had accepted","wrong":["accepted","would accept"]},{"q":"If only he ___ answer my emails!","ru":"Хоть бы он отвечал на мои письма!","right":"would","wrong":["will","had"]},{"q":"She wishes she ___ in Moscow now.","ru":"Ей хотелось бы сейчас быть в Москве.","right":"were","wrong":["is","would be"]},{"q":"We wish we ___ a bigger office.","ru":"Жаль, что у нас не больше офис.","right":"had","wrong":["have had","will have"]},{"q":"If only I ___ listened to your advice!","ru":"Если бы только я послушал твой совет!","right":"had","wrong":["have","would"]},{"q":"I wish my team ___ more often.","ru":"Хотелось бы, чтобы команда общалась чаще.","right":"would communicate","wrong":["will communicate","communicates"]},{"q":"I wish I ___ to the conference; everyone says it was great.","ru":"Жаль, что я не поехал на конференцию, все говорят, было здорово.","right":"had gone","wrong":["went","would go"]}]},"units":[{"id":"b2u36","tag":"Lead","title":"Лидерство","sub":"Вдохновлять, делегировать, личный пример","words":[{"id":"b2u36_0","en":"leadership","tr":"","ru":"лидерство, руководство","exEn":"Leadership is about trust.","exRu":"Лидерство основано на доверии."},{"id":"b2u36_1","en":"leader","tr":"","ru":"лидер, руководитель","exEn":"A good leader listens.","exRu":"Хороший лидер умеет слушать."},{"id":"b2u36_2","en":"inspire","tr":"","ru":"вдохновлять","exEn":"She inspires the whole team.","exRu":"Она вдохновляет всю команду."},{"id":"b2u36_3","en":"empower","tr":"","ru":"давать полномочия, наделять силой","exEn":"We empower employees to make decisions tr":"","ru":"встреча один на один","exEn":"I have weekly one-on-ones with each person.","exRu":"Каждую неделю я встречаюсь один на один с каждым."}]},{"id":"b2u38","tag":"HR","title":"Управление людьми","sub":"Премия, льгота, сокращение","words":[{"id":"b2u38_0","en":"performance review","tr":"","ru":"оценка эффективности","exEn":"My performance review is next week.","exRu":"Оценка моей эффективности на следующей неделе."},{"id":"b2u38_1","en":"recruit","tr":"","ru":"набирать (персонал)","exEn":"We're recruiting sales managers.","exRu":"Мы набираем менеджеров по продажам."},{"id":"b2u38_2","en":"headhunter","tr":"","ru":"хедхантер","exEn":"A headhunter called me yesterday.","exRu":"Вчера мне позвонил хедхантер."},{"id":"b2u38_3","en":"incentive","tr":"","ru":"стимул","exEn":"We offer incentives for good results.","exRu":"Мы поощряем за хорошие результаты."},{"id":"b2u38_4","en":"bonus","tr":"","ru":"премия, бонус","exEn":"Everyone got a bonus at New Year.","exRu":"На Новый год все получили премию."},{"id":"b2u38_5","en":"perk","tr":"","ru":"льгота, бонус","exEn":"Free lunch is a nice perk.","exRu":"Бесплатный обед — приятная льгота."},{"id":"b2u38_6","en":"reward","tr":"","ru":"вознаграждение, награждать","exEn":"Hard work should be rewarded.","exRu":"Упорный труд должен вознаграждаться."},{"id":"b2u38_7","en":"recognition","tr":"","ru":"признание","exEn":"People want recognition, not just money.","exRu":"Людям нужно признание, а не только деньги."},{"id":"b2u38_8","en":"career path","tr":"","ru":"карьерный путь","exEn":"We discuss career paths with every employee.","exRu":"Мы обсуждаем карьерный путь с каждым сотрудником."},{"id":"b2u38_9","en":"upskill","tr":"","ru":"повышать квалификацию","exEn":"We upskill our team every year.","exRu":"Мы ежегодно повышаем квалификацию команды."},{"id":"b2u38_10","en":"resign","tr":"","ru":"уволиться (по собственному)","exEn":"She resigned to start her own business.","exRu":"Она уволилась, чтобы начать свой бизнес."},{"id":"b2u38_11","en":"resignation","tr":"","ru":"заявление об уходе","exEn":"He handed in his resignation.","exRu":"Он подал заявление об уходе."},{"id":"b2u38_12","en":"dismiss","tr":"","ru":"уволить; отвергнуть","exEn":"He was dismissed for misconduct.","exRu":"Его уволили за нарушение."},{"id":"b2u38_13","en":"redundancy","tr":"","ru":"сокращение (штата)","exEn":"There were fifty redundancies.","exRu":"Сократили пятьдесят человек."},{"id":"b2u38_14","en":"exit interview","tr":"","ru":"беседа при увольнении","exEn":"We learned a lot from exit interviews.","exRu":"Беседы с уходящими сотрудниками многому нас научили."}]},{"id":"b2u39","tag":"PM","title":"Управление проектами","sub":"Внедрять, сроки, нагрузка","words":[{"id":"b2u39_0","en":"assign","tr":"","ru":"назначать, поручать","exEn":"I assigned the task to Anna.","exRu":"Я поручил задачу Анне."},{"id":"b2u39_1","en":"oversee","tr":"","ru":"курировать","exEn":"She oversees all marketing projects.","exRu":"Она курирует все маркетинговые проекты."},{"id":"b2u39_2","en":"coordinate","tr":"","ru":"координировать","exEn":"Who coordinates the launch?","exRu":"Кто координирует запуск?"},{"id":"b2u39_3","en":"monitor","tr":"","ru":"контролировать, отслеживать","exEn":"We monitor the results daily.","exRu":"Мы ежедневно отслеживаем результаты."},{"id":"b2u39_4","en":"implement","tr":"","ru":"внедрять","exEn":"We implemented a new CRM.","exRu":"Мы внедрили новую CRM."},{"id":"b2u39_5","en":"execute","tr":"","ru":"исполнять, реализовывать","exEn":"A plan is nothing without good execution.","exRu":"План ничего не стоит без хорошего исполнения."},{"id":"b2u39_6","en":"streamline","tr":"","ru":"оптимизировать, упростить","exEn":"We streamlined the approval process.","exRu":"Мы упростили процесс согласования."},{"id":"b2u39_7","en":"allocate","tr":"","ru":"распределять, выделять","exEn":"We allocated more budget to video.","exRu":"Мы выделили больше бюджета на видео."},{"id":"b2u39_8","en":"deliverable","tr":"","ru":"результат (этапа проекта)","exEn":"What are the deliverables for this stage?","exRu":"Какие результаты на этом этапе?"},{"id":"b2u39_9","en":"scope","tr":"","ru":"объём (работ), рамки","exEn":"That's outside the scope of the project.","exRu":"Это за рамками проекта."},{"id":"b2u39_10","en":"timeline","tr":"","ru":"график, сроки","exEn":"The timeline is very tight.","exRu":"Сроки очень сжатые."},{"id":"b2u39_11","en":"status update","tr":"","ru":"отчёт о статусе","exEn":"Send me a short status update on Friday.","exRu":"Пришли в пятницу короткий отчёт о статусе."},{"id":"b2u39_12","en":"accountability","tr":"","ru":"ответственность (за результат)","exEn":"We need more accountability.","exRu":"Нам нужно больше ответственности за результат."},{"id":"b2u39_13","en":"ownership","tr":"","ru":"ответственность, причастность; собственность","exEn":"Take ownership of your projects.","exRu":"Бери на себя ответственность за свои проекты."},{"id":"b2u39_14","en":"workload","tr":"","ru":"нагрузка (по работе)","exEn":"My workload is too heavy this month.","exRu":"В этом месяце у меня слишком большая нагрузка."}]},{"id":"b2u40","tag":"Fdbk","title":"Обратная связь","sub":"Прямолинейный, откровенный, в точку","words":[{"id":"b2u40_0","en":"constructive feedback","tr":"","ru":"конструктивная обратная связь","exEn":"Thanks for the constructive feedback.","exRu":"Спасибо за конструктивную обратную связь."},{"id":"b2u40_1","en":"blunt","tr":"","ru":"прямолинейный, резкий","exEn":"Sorry to be blunt, but it's not good enough.","exRu":"Простите за прямоту, но это недостаточно хорошо."},{"id":"b2u40_2","en":"sugarcoat","tr":"","ru":"приукрашивать","exEn":"Don't sugarcoat it, tell me the truth.","exRu":"Не приукрашивай, скажи правду."},{"id":"b2u40_3","en":"tactfully","tr":"","ru":"тактично","exEn":"She tactfully pointed out the mistake.","exRu":"Она тактично указала на ошибку."},{"id":"b2u40_4","en":"frank","tr":"","ru":"откровенный, прямой","exEn":"Let me be frank with you.","exRu":"Позвольте мне быть с вами откровенным."},{"id":"b2u40_5","en":"candid","tr":"","ru":"откровенный, честный","exEn":"Thank you for your candid opinion.","exRu":"Спасибо за честное мнение."},{"id":"b2u40_6","en":"to be fair","tr":"","ru":"справедливости ради","exEn":"To be fair, he had very little time.","exRu":"Справедливости ради, у него было очень мало времени."},{"id":"b2u40_7","en":"with all due respect","tr":"","ru":"при всём уважении","exEn":"With all due respect, I disagree.","exRu":"При всём уважении, я не согласен."},{"id":"b2u40_8","en":"take it personally","tr":"","ru":"принимать на свой счёт","exEn":"Don't take it personally.","exRu":"Не принимай это на свой счёт."},{"id":"b2u40_9","en":"thick-skinned","tr":"","ru":"толстокожий, невосприимчивый к критике","exEn":"In sales you have to be thick-skinned.","exRu":"В продажах нужно быть толстокожим."},{"id":"b2u40_10","en":"area for improvement","tr":"","ru":"зона роста","exEn":"Time management is my area for improvement.","exRu":"Тайм-менеджмент — моя зона роста."},{"id":"b2u40_11","en":"well done","tr":"","ru":"молодец, отлично сделано","exEn":"Well done, team!","exRu":"Отличная работа, команда!"},{"id":"b2u40_12","en":"keep it up","tr":"","ru":"так держать","exEn":"Great results, keep it up!","exRu":"Отличные результаты, так держать!"},{"id":"b2u40_13","en":"not up to standard","tr":"","ru":"не соответствует уровню","exEn":"The design is not up to standard.","exRu":"Дизайн не дотягивает до нужного уровня."},{"id":"b2u40_14","en":"spot on","tr":"","ru":"в точку, абсолютно верно","exEn":"Your analysis was spot on.","exRu":"Твой анализ попал в точку."}]},{"id":"b2u41","tag":"Wish","title":"Сожаления и желания","sub":"Жаль, что; если бы только; отпустить","words":[{"id":"b2u41_0","en":"I wish","tr":"","ru":"жаль, что; хотел бы","exEn":"I wish I knew the answer.","exRu":"Жаль, что я не знаю ответа."},{"id":"b2u41_1","en":"if only","tr":"","ru":"если бы только","exEn":"If only I had more time!","exRu":"Если бы только у меня было больше времени!"},{"id":"b2u41_2","en":"should have","tr":"","ru":"надо было","exEn":"I should have called you.","exRu":"Надо было тебе позвонить."},{"id":"b2u41_3","en":"wishful thinking","tr":"","ru":"принятие желаемого за действительное","exEn":"That's just wishful thinking.","exRu":"Это просто выдавание желаемого за действительное."},{"id":"b2u41_4","en":"would have liked","tr":"","ru":"хотелось бы (о прошлом)","exEn":"I would have liked more time to prepare.","exRu":"Мне бы хотелось больше времени на подготовку."},{"id":"b2u41_5","en":"miss out on","tr":"","ru":"упустить","exEn":"Don't miss out on this opportunity.","exRu":"Не упусти эту возможность."},{"id":"b2u41_6","en":"dwell on","tr":"","ru":"зацикливаться на","exEn":"Don't dwell on the past.","exRu":"Не зацикливайся на прошлом."},{"id":"b2u41_7","en":"move on","tr":"","ru":"двигаться дальше","exEn":"It's time to move on.","exRu":"Пора двигаться дальше."},{"id":"b2u41_8","en":"let go","tr":"","ru":"отпустить","exEn":"Sometimes you have to let go.","exRu":"Иногда нужно отпустить."},{"id":"b2u41_9","en":"make amends","tr":"","ru":"загладить вину","exEn":"He tried to make amends for his mistake.","exRu":"Он пытался загладить вину за ошибку."},{"id":"b2u41_10","en":"second chance","tr":"","ru":"второй шанс","exEn":"Everyone deserves a second chance.","exRu":"Каждый заслуживает второго шанса."},{"id":"b2u41_11","en":"it's no use","tr":"","ru":"бесполезно","exEn":"It's no use complaining.","exRu":"Жаловаться бесполезно."},{"id":"b2u41_12","en":"what's done is done","tr":"","ru":"что сделано, то сделано","exEn":"What's done is done; let's fix it.","exRu":"Что сделано, то сделано, давай исправлять."},{"id":"b2u41_13","en":"learn from mistakes","tr":"","ru":"учиться на ошибках","exEn":"The best teams learn from mistakes.","exRu":"Лучшие команды учатся на ошибках."},{"id":"b2u41_14","en":"turn back the clock","tr":"","ru":"повернуть время вспять","exEn":"I wish I could turn back the clock.","exRu":"Хотел бы я повернуть время вспять."}]},{"id":"b2u42","tag":"Culture","title":"Корпоративная культура","sub":"Ценности, бюрократия, смысл","words":[{"id":"b2u42_0","en":"corporate culture","tr":"","ru":"корпоративная культура","exEn":"Corporate culture eats strategy for breakfast.","exRu":"Корпоративная культура важнее стратегии."},{"id":"b2u42_1","en":"values","tr":"","ru":"ценности","exEn":"Our values are honesty and speed.","exRu":"Наши ценности — честность и скорость."},{"id":"b2u42_2","en":"transparency","tr":"","ru":"прозрачность","exEn":"We believe in transparency.","exRu":"Мы за прозрачность."},{"id":"b2u42_3","en":"flexibility","tr":"","ru":"гибкость","exEn":"Employees value flexibility.","exRu":"Сотрудники ценят гибкость."},{"id":"b2u42_4","en":"open-door policy","tr":"","ru":"политика открытых дверей","exEn":"The CEO has an open-door policy.","exRu":"У гендиректора политика открытых дверей."},{"id":"b2u42_5","en":"dress code","tr":"","ru":"дресс-код","exEn":"There's no dress code in our office.","exRu":"В нашем офисе нет дресс-кода."},{"id":"b2u42_6","en":"hybrid work","tr":"","ru":"гибридная работа","exEn":"Hybrid work is the new normal.","exRu":"Гибридная работа — новая норма."},{"id":"b2u42_7","en":"toxic","tr":"","ru":"токсичный","exEn":"It was a toxic work environment.","exRu":"Это была токсичная рабочая среда."},{"id":"b2u42_8","en":"office politics","tr":"","ru":"офисные интриги","exEn":"I hate office politics.","exRu":"Терпеть не могу офисные интриги."},{"id":"b2u42_9","en":"red tape","tr":"","ru":"бюрократия, волокита","exEn":"There's too much red tape.","exRu":"Слишком много бюрократии."},{"id":"b2u42_10","en":"work ethic","tr":"","ru":"трудовая этика","exEn":"She has a strong work ethic.","exRu":"У неё сильная трудовая этика."},{"id":"b2u42_11","en":"overworked","tr":"","ru":"перегруженный работой","exEn":"The team is overworked.","exRu":"Команда перегружена."},{"id":"b2u42_12","en":"underpaid","tr":"","ru":"недооплачиваемый","exEn":"Many designers are underpaid.","exRu":"Многим дизайнерам недоплачивают."},{"id":"b2u42_13","en":"job satisfaction","tr":"","ru":"удовлетворённость работой","exEn":"Job satisfaction is more than money.","exRu":"Удовлетворённость работой — это не только деньги."},{"id":"b2u42_14","en":"sense of purpose","tr":"","ru":"ощущение смысла","exEn":"People need a sense of purpose.","exRu":"Людям нужно ощущение смысла."}]}],"text":{"title":"Ошибки основателя","sub":"Колонка руководителя","paras":["When I started my agency, I tried to do everything myself. I wrote the scripts, met the clients and checked every banner. I wish someone had told me back then that micromanaging doesn't scale.","After a year, the team's morale was low, two people had resigned, and I was close to burnout. If only I had learned to delegate earlier, I could have kept them.","Things changed when I started weekly one-on-ones and gave people real ownership of their projects. I set clear deliverables and then stepped back. To be fair, it was hard at first: I still wish I could check everything.","Today the team is twelve people, and most decisions are made without me. My only regret is that I didn't build this culture from day one."],"qs":[{"q":"Какую ошибку автор совершал вначале?","right":"Пытался делать всё сам","wrong":["Нанимал слишком много людей","Не встречался с клиентами"]},{"q":"Что произошло через год?","right":"Упал боевой дух, двое уволились","wrong":["Агентство закрылось","Удвоилась выручка"]},{"q":"Что изменило ситуацию?","right":"Встречи один на один и реальная ответственность сотрудников","wrong":["Повышение зарплат всем","Переезд в новый офис"]},{"q":"О чём автор сожалеет?","right":"Что не выстроил такую культуру с первого дня","wrong":["Что открыл агентство","Что нанял двенадцать человек"]}]}},{"id":"b2m7","title":"Медиа и общество","colors":["#b08a3e","#5a4214"],"grammar":{"title":"Глаголы косвенной речи","text":"Вместо said и told используем точные глаголы, и у каждого своя конструкция. + to: agree, refuse, promise, offer, threaten. + кого-то + to: advise, warn, persuade, encourage, remind. + -ing: suggest, recommend, deny, admit. С предлогом: apologize for, accuse of, blame on или blame for.","ex":[["He promised to send the contract.","Он пообещал прислать договор."],["She advised me to wait.","Она посоветовала мне подождать."],["They denied breaking the rules.","Они отрицали, что нарушили правила."]],"drills":[{"q":"He promised ___ the report by Monday.","ru":"Он пообещал прислать отчёт к понедельнику.","right":"to send","wrong":["sending","send"]},{"q":"She advised me ___ the offer.","ru":"Она посоветовала мне принять предложение.","right":"to accept","wrong":["accepting","accept"]},{"q":"They denied ___ the data.","ru":"Они отрицали, что слили данные.","right":"leaking","wrong":["to leak","leak"]},{"q":"He apologized ___ being late.","ru":"Он извинился за опоздание.","right":"for","wrong":["of","about"]},{"q":"The client accused us ___ missing the deadline.","ru":"Клиент обвинил нас в срыве срока.","right":"of","wrong":["for","in"]},{"q":"I suggested ___ a short video.","ru":"Я предложил снять короткое видео.","right":"making","wrong":["to make","make"]},{"q":"She refused ___ the document.","ru":"Она отказалась подписывать документ.","right":"to sign","wrong":["signing","sign"]},{"q":"They blamed the delay ___ the supplier.","ru":"Они свалили задержку на поставщика.","right":"on","wrong":["for","of"]}]},"units":[{"id":"b2u43","tag":"Verbs","title":"Глаголы передачи речи","sub":"Обвинять, заверять, намекать","words":[{"id":"b2u43_0","en":"accuse","tr":"","ru":"обвинять","exEn":"They accused us of copying their design.","exRu":"Они обвинили нас в копировании их дизайна."},{"id":"b2u43_1","en":"blame","tr":"","ru":"винить","exEn":"Don't blame the team.","exRu":"Не вини команду."},{"id":"b2u43_2","en":"encourage","tr":"","ru":"поощрять, побуждать","exEn":"I encourage you to apply.","exRu":"Советую вам подать заявку."},{"id":"b2u43_3","en":"urge","tr":"","ru":"настоятельно призывать" ory","tr":"","ru":"развивающаяся история","exEn":"This is a developing story.","exRu":"История ещё развивается."},{"id":"b2u49_14","en":"editorial","tr":"","ru":"редакционная статья; редакционный","exEn":"The editorial criticized the decision.","exRu":"В редакционной статье критиковали решение."}]}],"text":{"title":"ИИ и малый бизнес","sub":"Статья","paras":["A recent survey by a Novosibirsk research center suggests that attitudes towards artificial intelligence are changing fast. According to the report, sixty percent of small business owners now use AI tools at least once a week, compared with just fifteen percent two years ago.","Not everyone is enthusiastic. Several respondents admitted feeling anxious about job displacement, and some accused tech giants of moving too fast without proper regulation. One owner warned that deepfakes could seriously damage trust in voice advertising.","Experts, however, urge business owners not to panic. \"Automation replaces tasks, not people,\" one researcher observed, encouraging companies to upskill their teams rather than lay staff off.","The authors recommend that local authorities offer free training programs. They also caution that the digital divide between big cities and small towns may grow if nothing is done."],"qs":[{"q":"Какая доля владельцев малого бизнеса пользуется ИИ еженедельно?","right":"Шестьдесят процентов","wrong":["Пятнадцать процентов","Почти все"]},{"q":"Чего опасаются некоторые респонденты?","right":"Вытеснения рабочих мест","wrong":["Роста налогов","Нехватки офисов"]},{"q":"Что советуют эксперты?","right":"Повышать квалификацию команды, а не сокращать людей","wrong":["Запретить ИИ","Ждать регулирования"]},{"q":"О чём предупреждают авторы?","right":"Цифровой разрыв между городами может вырасти","wrong":["ИИ скоро исчезнет","Бизнес уйдёт из интернета"]}]}},{"id":"b2m8","title":"Формально и разговорно","colors":["#3f6e9e","#1b3350"],"grammar":{"title":"Стиль и регистр","text":"Одна мысль звучит по-разному в /* ===================== INDEX ===================== */
const LEVELS = COURSE.levels, PLANNED = COURSE.planned;
const ALL_LV = [...LEVELS.map(l=>l.id), ...PLANNED.map(l=>l.id)];
const BYID = {}, ALL = [];
LEVELS.forEach(lv=>lv.modules.forEach((m,mi)=>{
  m.level=lv.id; m.n=mi+1; m.bg=`linear-gradient(145deg,${m.colors[0]},${m.colors[1]})`;
  m.units.forEach(u=>{u.mod=m; u.words.forEach(w=>{w.unit=u.id; w.mod=m.id; w.level=lv.id; BYID[w.id]=w; ALL.push(w)})});
}));
const GOAL=50, LESSON_SIZE=5, TEST_LEN=20, PASS=80;

/* ===================== STATE ===================== */
const KEY='english-zero-v1';
/* ---- Telegram Mini App: облачное хранение прогресса ---- */
const TG=(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)?window.Telegram.WebApp:null;
const CLOUD=TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')?TG.CloudStorage:null;
const TG_USER=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user||null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let cloudTimer=null;
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(CLOUD){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,1200)}}
function packState(st){
  const l=Object.entries(st.learned).map(([id,e])=>[id,e.iv,Math.round(e.ef*100),e.reps,e.due].join(':')).join(';');
  return JSON.stringify({...st,learned:undefined,l});
}
function unpackState(str){
  const o=JSON.parse(str), learned={};
  (o.l||'').split(';').filter(Boolean).forEach(r=>{const [id,iv,ef,reps,due]=r.split(':');learned[id]={iv:+iv,ef:+ef/100,reps:+reps,due:+due}});
  delete o.l; o.learned=learned; return o;
}
const cs=(fn,...a)=>new Promise(res=>{try{CLOUD[fn](...a,(err,v)=>res(err?null:v))}catch(e){res(null)}});
let cloudChunks=0;
async function cloudSave(){
  const str=packState(S), parts=[];
  for(let i=0;i<str.length;i+=3800) parts.push(str.slice(i,i+3800));
  await Promise.all(parts.map((p,i)=>cs('setItem','p'+i,p)));
  await cs('setItem','meta',JSON.stringify({n:parts.length,ts:S.ts}));
  if(cloudChunks>parts.length){const old=[];for(let i=parts.length;i<cloudChunks;i++)old.push('p'+i);await cs('removeItems',old)}
  cloudChunks=parts.length;
}
async function cloudLoad(){
  const raw=await cs('getItem','meta'); if(!raw) return;
  let meta; try{meta=JSON.parse(raw)}catch(e){return}
  cloudChunks=meta.n;
  if((S.ts||0)>=meta.ts) return;
  const keys=[...Array(meta.n)].map((_,i)=>'p'+i), got=await cs('getItems',keys); if(!got) return;
  try{
    const st=unpackState(keys.map(k=>got[k]||'').join(''));
    S=Object.assign({learned:{},xp:0,days:{},gram:{},texts:{},passed:{},lvl:null,open:{}},st);
    S.learned=Object.fromEntries(Object.entries(S.learned).filter(([id])=>BYID[id]));
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(view!=='lesson') render();
  }catch(e){}
}
let S = Object.assign({learned:{},xp:0,days:{},gram:{},texts:{},passed:{},lvl:null,open:{}}, load()||{});
S.learned = Object.fromEntries(Object.entries(S.learned).filter(([id])=>BYID[id]));

function dkey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dnum(k=dkey()){return Math.round(new Date(k+'T00:00:00').getTime()/864e5)}
const todayXP=()=>S.days[dkey()]||0;
function addXP(n){S.xp+=n;const k=dkey();S.days[k]=(S.days[k]||0)+n;save()}
function streak(){let d=new Date(),n=0;if(!S.days[dkey(d)])d.setDate(d.getDate()-1);while(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
const learnedCount=()=>Object.keys(S.learned).length;
const unitDone=u=>u.words.filter(w=>S.learned[w.id]).length;
function dueIds(){const t=dnum();return Object.keys(S.learned).filter(id=>S.learned[id].due<=t)}

/* course order: grammar → units for each module */
function items(lv){return lv.modules.flatMap(m=>[{t:'grammar',m},...m.units.map(u=>({t:'unit',u,m})),...(m.text?[{t:'text',m}]:[])])}
const itemDone=it=>it.t==='grammar'?!!S.gram[it.m.id]:it.t==='text'?!!S.texts[it.m.id]:unitDone(it.u)===it.u.words.length;
function levelOpen(id){const i=ALL_LV.indexOf(id);return i===0||!!S.passed[ALL_LV[i-1]]}
function currentItem(lv){return items(lv).find(it=>!itemDone(it))||null}
function isUnlocked(lv,it){const list=items(lv),i=list.findIndex(x=>x.t===it.t&&(x.u||x.m)===(it.u||it.m));return levelOpen(lv.id)&&list.slice(0,i).every(itemDone)}
function activeLevel(){
  if(S.lvl&&ALL_LV.includes(S.lvl)) return S.lvl;
  const open=LEVELS.filter(l=>levelOpen(l.id)); return (open[open.length-1]||LEVELS[0]).id;
}
function nextAction(){
  for(const lv of LEVELS){ if(!levelOpen(lv.id)) break; const c=currentItem(lv); if(c) return {lv,it:c}; if(!S.passed[lv.id]) return {lv,it:{t:'test'}}; }
  return null;
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function plural(n,a,b,c){const m=n%10,h=n%100;return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c}

function rowHTML(lv,it,cur){
  const m=it.m, lock=!isUnlocked(lv,it), done=itemDone(it), isCur=cur&&cur.t===it.t&&(cur.u||cur.m)===(it.u||it.m);
  if(it.t==='grammar'){
    const right=isCur?`<button class="pill" data-act="grammar" data-m="${m.id}">Начать</button>`
      :done?`<button class="again full" data-act="grammar" data-m="${m.id}">${I.check}Ещё раз</button>`:`<span class="cnt">${I.lock}</span>`;
    return `<li class="unit ${lock&&!done?'locked':''}"><span class="badge gr" style="background:${m.bg}">Gr</span>
      <div><b>Грамматика</b><span class="s">${esc(m.grammar.title)}</span></div>${right}</li>`;
  }
  if(it.t==='text'){
    const tx=m.text, right=isCur?`<button class="pill" data-act="text" data-m="${m.id}">Читать</button>`
      :done?`<button class="again full" data-act="text" data-m="${m.id}">${I.check}Ещё раз</button>`:`<span class="cnt">${I.lock}</span>`;
    return `<li class="unit ${lock&&!done?'locked':''}"><span class="badge gr" style="background:${m.bg}">Txt</span>
      <div><b>Текст: ${esc(tx.title)}</b><span class="s">${esc(tx.sub)} · ${tx.qs.length} вопроса</span></div>${right}</li>`;
  }
  const u=it.u, d=unitDone(u), n=u.words.length;
  const right=isCur?`<button class="pill" data-act="unit" data-u="${u.id}">${d?'Дальше':'Начать'}</button>`
    :done?`<button class="again full" data-act="unit" data-u="${u.id}">${I.check}${d}/${n}</button>`
    :lock?`<span class="cnt">${I.lock}</span>`:`<button class="again" data-act="unit" data-u="${u.id}">${d}/${n}</button>`;
  return `<li class="unit ${lock&&!d?'locked':''}"><span class="badge" style="background:${m.bg}">${esc(u.tag)}</span>
    <div><b>${esc(u.title)}</b><span class="s">${esc(u.sub)}</span><div class="bar"><i style="width:${d/n*100}%"></i></div></div>${right}</li>`;
}
function courseHTML(lvId){
  const lv=LEVELS.find(l=>l.id===lvId);
  if(!lv){
    const p=PLANNED.find(l=>l.id===lvId), i=ALL_LV.indexOf(lvId);
    return `<p class="lvl-note">${p.name} · около ${p.words} новых слов. Уровень сейчас в разработке и откроется после теста ${ALL_LV[i-1]}.</p>
    <div class="mods">${p.modules.map((m,k)=>`<div class="mod planned"><div class="mod-h"><span><span class="eyebrow">Модуль ${k+1}</span><b>${esc(m.title)}</b></span><span class="meta">${I.lock}</span></div>
      <p style="margin:0 0 12px;font-size:13px;color:var(--ink-soft)">Грамматика: ${esc(m.grammar)}</p></div>`).join('')}</div>`;
  }
  const cur=levelOpen(lv.id)?currentItem(lv):null, list=items(lv);
  const total=lv.modules.reduce((s,m)=>s+m.units.length*10,0), got=ALL.filter(w=>w.level===lv.id&&S.learned[w.id]).length;
  const curMod=cur?cur.m.id:null;
  const mods=lv.modules.map(m=>{

    return `<div class="mod ${open?'open':''}">
      <button class="mod-h" data-act="toggle" data-m="${m.id}" aria-expanded="${open}"><span><span class="eyebrow">Модуль ${m.n}</span><b>${esc(m.title)}</b></span>
      <span class="meta ${dn===its.length?'full':''}">${dn}/${its.length}<span class="chev">${I.chev}</span></span></button>
      ${open?`<ul class="units">${its.map(it=>rowHTML(lv,it,cur)).join('')}</ul>`:''}</div>`;
  }).join('');
  const passed=S.passed[lv.id], allDone=!cur;
  const testBtn=passed?`<span class="cnt full" style="color:#8fe0b4">${I.check}${passed}%</span>`
    :allDone?`<button class="pill" data-act="test" data-l="${lv.id}">Пройти</button>`
    :`<button class="ghostbtn" data-act="test" data-l="${lv.id}">Проверить</button>`;
  return `<p class="lvl-note">${lv.name} · ${got}/${total} слов. ${levelOpen(lv.id)?'':'Откроется после теста предыдущего уровня.'}</p>
    <div class="mods">${mods}</div>
    ${levelOpen(lv.id)?`<div class="testrow"><span class="badge">${lv.id}</span><div><b>Тест уровня ${lv.id}</b><span class="s">${passed?'Сдан. Следующий уровень открыт.':allDone?`${TEST_LEN} вопросов, нужно ${PASS}%`:'Уже знаешь? Сдай тест и перейди дальше'}</span></div>${testBtn}</div>`:''}`;
}
