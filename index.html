<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Английский с нуля</title>
<style>html,body{margin:0}</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: phone-column app — navy glass header over a pale frosted course sheet; gold marks the single next action */
:root{
  --navy-deep:#0f1f3a; --navy:#1d3760; --navy-hi:#2d4f84;
  --glass:rgba(255,255,255,.085); --glass-line:rgba(255,255,255,.16);
  --sheet:#e6edf7; --sheet-2:#d5e0f1; --card:#f6f8fc; --line:#c9d5e8;
  --ink:#132846; --ink-soft:#5a6c8b; --on-navy:#f3f6fc; --on-navy-soft:#a9b9d6;
  --gold:#f3c552; --gold-deep:#e0a72c; --gold-ink:#3a2905;
  --good:#24895a; --good-bg:#d9f1e3; --bad:#c9443e; --bad-bg:#fbe0de;
  --outer:#bfcde5;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-hi)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 0% 0%,var(--navy-hi),transparent 60%),linear-gradient(175deg,var(--navy) 0%,var(--navy-deep) 100%);color:var(--on-navy)}
@media (min-width:560px){
  body{padding-block:28px}
  .app{min-height:calc(100vh - 56px);border-radius:38px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(15,31,58,.6)}
}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.muted{color:var(--on-navy-soft)}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lbl{font-size:11.5px;letter-spacing:.04em;color:var(--on-navy-soft);text-transform:uppercase;font-weight:600}

/* ---------- home header ---------- */
.top{display:grid;grid-template-columns:1fr minmax(0,170px);gap:14px;padding-block:22px 16px}
.ava{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:22px;
  background:linear-gradient(145deg,#3f68a6,#1a3155);border:1px solid var(--glass-line);box-shadow:0 10px 24px -10px #000a}
.hello p{margin:16px 0 4px;font-size:14px}
.hello h1{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,6vw,26px);line-height:1.18;margin:0;text-wrap:balance}
.streak{position:relative;padding:16px 30px 16px 16px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.streak::after{content:"";position:absolute;inset:auto -30px -40px -10px;height:90px;border-radius:50%;background:rgba(255,255,255,.05)}
.streak .big{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;margin-top:10px}
.streak .big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--on-navy-soft)}
.streak .sub{font-size:12.5px;color:var(--on-navy-soft)}
.streak .vert{position:absolute;right:8px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap;color:var(--on-navy-soft)}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding-bottom:22px}
.review-btn{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;text-align:left}
.review-btn .circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.review-btn b{display:block;font-weight:700;font-size:15px}
.review-btn small{display:block;font-size:12px;color:var(--on-navy-soft)}
.review-btn.has .circ{background:var(--gold);color:var(--gold-ink)}
.goal{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:12px 10px}
.goal b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.goal .sep{width:1px;align-self:stretch;background:var(--glass-line)}

/* ---------- sheet ---------- */
.sheet{flex:1;background:linear-gradient(180deg,var(--sheet),var(--sheet-2));color:var(--ink);border-radius:30px 30px 0 0;padding-block:22px 18px;box-shadow:0 -14px 40px -20px #0009}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.sheet-head h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.sheet-head span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.units{list-style:none;margin:0;display:flex;flex-direction:column}
.unit{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.badge{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;color:#fff;
  box-shadow:0 8px 16px -8px #1d376099}
.unit b{display:block;font-weight:700;font-size:15.5px}
.unit .s{display:block;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:5px;background:rgba(19,40,70,.1);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4a74b5,var(--navy))}
.unit .cnt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.unit .cnt.full{color:var(--good)}
.unit.locked{opacity:.5}
.pill{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--gold-ink);font-weight:700;font-size:13px;padding:9px 16px;border-radius:14px;box-shadow:0 8px 18px -8px var(--gold-deep)}

/* ---------- nav ---------- */
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--navy);border-top:1px solid var(--glass-line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--on-navy-soft);padding:6px 0}
.nav button::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.nav button.on{color:var(--on-navy)}
.nav button.on::after{background:var(--on-navy)}
.nav .dotn{font-size:10.5px;background:var(--gold);color:var(--gold-ink);border-radius:9px;padding:0 6px;margin-left:4px;font-weight:800}

/* ---------- screen header (lesson/review/stats) ---------- */
.shead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;padding-block:20px 18px}
.shead h1{margin:0;text-align:center;font-family:var(--f-display);font-weight:600;font-size:18px}
.circle-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--glass-line);background:var(--glass)}
.chip{justify-self:end;font-size:12px;font-weight:700;border:1px solid var(--glass-line);border-radius:12px;padding:5px 9px;color:var(--on-navy-soft);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-bottom:18px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .3s}

/* ---------- lesson content ---------- */
.stage{display:flex;flex-direction:column;gap:16px;min-height:100%}
.sheet.flex{display:flex;flex-direction:column}
.q-label{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.wcard{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:0 14px 30px -20px #13284699;display:flex;flex-direction:column;gap:6px}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,8vw,36px);line-height:1.15;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tr{font-size:15px;color:var(--ink-soft);font-weight:500}
.ru{font-size:18px;font-weight:700;margin-top:8px}
.ex{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
.ex .en{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.ex .rus{color:var(--ink-soft);font-size:14.5px}
.spk{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:var(--on-navy);flex:none;box-shadow:0 6px 14px -6px var(--navy)}
.spk.sm{width:30px;height:30px}
.spk.xl{width:84px;height:84px;margin:6px auto}
.prompt{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,7vw,30px);line-height:1.2;margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 12px;font-weight:700;font-size:15.5px;text-align:center;min-height:62px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt[disabled]{cursor:default}
.gram{background:var(--card);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.gram h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px}
.gram p{margin:0;max-width:60ch}
.gram ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.gram li{background:var(--sheet);border-radius:14px;padding:10px 12px}
.gram li b{display:block}
.gram li span{color:var(--ink-soft);font-size:14px}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tok{background:var(--card);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.tok.used{visibility:hidden}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.fb{border-radius:18px;padding:14px 16px;font-weight:600;font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb small{font-weight:500;color:var(--ink)}
.btn{width:100%;border-radius:18px;padding:16px;font-weight:800;font-size:16px;text-align:center}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--gold-ink);box-shadow:0 12px 24px -12px var(--gold-deep)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

/* ---------- review ---------- */
.flash{background:var(--card);border-radius:26px;padding:30px 22px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;box-shadow:0 14px 30px -20px #13284699}
.flash .ex{align-self:stretch;text-align:left}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border-radius:16px;padding:10px 4px;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--line)}
.grade small{font-weight:600;font-size:11.5px;color:var(--ink-soft)}
.grade.g0{color:var(--bad)} .grade.g3{color:var(--good)}
.empty{background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.empty p{margin:0;color:var(--ink-soft);max-width:34ch}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:22px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--f-display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.week{background:var(--card);border-radius:22px;padding:18px 16px 12px;margin-bottom:18px}
.week h3,.ulist h3{margin:0 0 12px;font-size:14px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 40px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars i{display:block;width:70%;max-width:28px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#4a74b5,var(--navy));min-height:3px}
.bars div.today i{background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.bars span{font-size:10.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding-top:6px}
.ulist{background:var(--card);border-radius:22px;padding:18px 16px}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0}
.urow span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.urow .bar{grid-column:1/-1;margin-top:0}
.reset{margin-top:18px;text-align:center}
.reset button{font-size:13px;color:var(--ink-soft);text-decoration:underline}
.confirm{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:13.5px}
.confirm button{border-radius:12px;padding:8px 14px;font-weight:700;text-decoration:none}

/* ---------- done ---------- */
.done-hero{text-align:center;padding-block:34px 24px;display:flex;flex-direction:column;gap:8px;align-items:center}
.done-hero h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
.medal{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:var(--gold-ink);box-shadow:0 18px 40px -16px var(--gold-deep)}
.wlist{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{background:var(--card);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.wlist b{display:block}
.wlist span{font-size:13px;color:var(--ink-soft)}

@media (max-width:370px){
  .top{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.reading p{display:block;line-height:1.6;font-size:15.5px}
.reading p .spk{vertical-align:middle;margin-left:4px}
.listen-all{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--ink-soft)}
/* ---------- levels & modules ---------- */
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{border:1.5px solid var(--line);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.lv.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.lv.passed:not(.on){color:var(--good);border-color:var(--good)}
.lv svg{width:12px;height:12px}
.lvl-note{margin:2px 0 10px;font-size:13px;color:var(--ink-soft);max-width:60ch}
.mods{display:flex;flex-direction:column;gap:10px}
.mod{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:4px 14px}
.mod-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;text-align:left}
.mod-h .eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.mod-h b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;margin-top:2px}
.mod-h .meta{font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.mod-h .meta.full{color:var(--good)}
.chev{transition:transform .2s;display:inline-flex}
.mod.open .chev{transform:rotate(180deg)}
.mod .units{border-top:1px solid var(--line)}
.mod.planned{opacity:.72}
.mod.planned .mod-h{cursor:default}
.again{font-weight:700;font-size:12.5px;color:var(--ink-soft);border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;gap:5px;align-items:center}
.again.full{color:var(--good);border-color:#9fd3b6}
.again svg{width:14px;height:14px}
.badge.gr{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.02em}
.testrow{margin-top:12px;background:var(--navy);color:var(--on-navy);border-radius:22px;padding:14px;display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:14px;align-items:center}
.testrow .badge{background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:var(--gold-ink);font-family:var(--f-body);font-weight:800}
.testrow b{display:block;font-size:15.5px}
.testrow .s{font-size:12.5px;color:var(--on-navy-soft)}
.testrow .ghostbtn{border:1.5px solid var(--glass-line);border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px}
.gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--navy);margin:0 4px;text-align:center;color:var(--navy)}
.gap.ok{border-color:var(--good);color:var(--good)} .gap.no{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--ink-soft);font-size:15px;margin:-4px 0 0}
.score{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
</style>

<script>

e…? Отрицание: don't или doesn't, и глагол уже без -s.","ex":[["I get up at seven.","Я встаю в семь."],["She works from home.","Она работает из дома."],["Do you drink coffee?","Ты пьёшь кофе?"]],"drills":[{"q":"She ___ in marketing.","ru":"Она работает в маркетинге.","right":"works","wrong":["work","working"]},{"q":"I ___ coffee every morning.","ru":"Я пью кофе каждое утро.","right":"drink","wrong":["drinks","drinking"]},{"q":"___ he live in Moscow?","ru":"Он живёт в Москве?","right":"Does","wrong":["Do","Is"]},{"q":"We ___ work on Sunday.","ru":"Мы не работаем в воскресенье.","right":"don't","wrong":["doesn't","aren't"]},{"q":"My boss ___ at nine.","ru":"Мой начальник начинает в девять.","right":"starts","wrong":["start","starting"]},{"q":"___ you like tea?","ru":"Ты любишь чай?","right":"Do","wrong":["Does","Are"]},{"q":"He ___ like meetings.","ru":"Он не любит встречи.","right":"doesn't","wrong":["don't","isn't"]},{"q":"They ___ English every day.","ru":"Они говорят по-английски каждый день.","right":"speak","wrong":["speaks","speaking"]}]},"units":[{"id":"u5","tag":"Day","title":"Мой день","sub":"Утро, кофе, время","words":[{"id":"u5_0","en":"morning","tr":"монинг","ru":"утро","exEn":"Good morning, team!","exRu":"Доброе утро, команда!"},{"id":"u5_1","en":"evening","tr":"ивнинг","ru":"вечер","exEn":"I read in the evening.","exRu":"Вечером я читаю."},{"id":"u5_2","en":"day","tr":"дэй","ru":"день","exEn":"Have a nice day!","exRu":"Хорошего дня!"},{"id":"u5_3","en":"today","tr":"тудэй","ru":"сегодня","exEn":"I am busy today.","exRu":"Сегодня я занят."},{"id":"u5_4","en":"tomorrow","tr":"тумороу","ru":"завтра","exEn":"See you tomorrow.","exRu":"Увидимся завтра."},{"id":"u5_5","en":"coffee","tr":"кофи","ru":"кофе","exEn":"I drink coffee every morning.","exRu":"Я пью кофе каждое утро."},{"id":"u5_6","en":"breakfast","tr":"брэкфаст","ru":"завтрак","exEn":"Breakfast is at eight.","exRu":"Завтрак в восемь."},{"id":"u5_7","en":"time","tr":"тайм","ru":"время","exEn":"What t en I moved back.","ru":"Я прожил в Корее четыре года, потом вернулся.","right":"lived","wrong":["have lived","have been living"]},{"q":"We ___ three new clients this month.","ru":"В этом месяце у нас уже три новых клиента.","right":"have got","wrong":["got","get"]},{"q":"When ___ you start your business?","ru":"Когда ты начал свой бизнес?","right":"did","wrong":["have","were"]},{"q":"She ___ here since March.","ru":"Она работает здесь с марта.","right":"has worked","wrong":["worked","works"]},{"q":"I ___ waiting for you for an hour!","ru":"Я жду тебя уже час!","right":"have been","wrong":["was","am"]},{"q":"___ you ever worked abroad?","ru":"Ты когда-нибудь работал за границей?","right":"Have","wrong":["Did","Were"]},{"q":"They ___ the contract last Friday.","ru":"Они подписали договор в прошлую пятницу.","right":"signed","wrong":["have signed","have been signing"]},{"q":"How long ___ you been learning English?","ru":"Как долго ты учишь английский?","right":"have","wrong":["did","are"]}]},"units":[{"id":"b1u01","tag":"Path","title":"Жизненный путь","sub":"Возможность, вызов, поворот","words":[{"id":"b1u01_0","en":"opportunity","tr":"","ru":"возможность","exEn":"It was a great opportunity.","exRu":"Это была отличная возможность."},{"id":"b1u01_1","en":"challenge","tr":"","ru":"вызов, трудная задача","exEn":"Moving abroad was a real challenge.","exRu":"Переезд за границу был настоящим испытанием."},{"id":"b1u01_2","en":"turning point","tr":"","ru":"поворотный момент","exEn":"That year was a turning point in my life.","exRu":"Тот год стал поворотным в моей жизни."},{"id":"b1u01_3","en":"ambition","tr":"","ru":"амбиция, стремление","exEn":"She has a lot of ambition.","exRu":"У неё много амбиций."},{"id":"b1u01_4","en":"background","tr":"","ru":"опыт, образование, происхождение","exEn":"He has a background in finance.","exRu":"У него опыт в финансах."},{"id":"b1u01_5","en":"generation","tr":"","ru":"поколение","exEn":"My generation grew up without smartphones.","exRu":"М he food was incredible.","exRu":"Еда была невероятной."}]},{"id":"b1u07","tag":"Trend","title":"Перемены","sub":"Рост, спад, постепенно","words":[{"id":"b1u07_0","en":"improvement","tr":"","ru":"улучшение","exEn":"There's a big improvement.","exRu":"Есть большое улучшение."},{"id":"b1u07_1","en":"decline","tr":"","ru":"спад, снижаться","exEn":"Sales are in decline.","exRu":"Продажи падают."},{"id":"b1u07_2","en":"rise","tr":"","ru":"рост, подниматься","exEn":"There was a sharp rise in prices.","exRu":"Цены резко выросли."},{"id":"b1u07_3","en":"drop","tr":"","ru":"падение, падать, ронять","exEn":"We saw a drop in sales.","exRu":"Мы увидели падение продаж."},{"id":"b1u07_4","en":"gradually","tr":"","ru":"постепенно","exEn":"Things gradually got better.","exRu":"Постепенно всё наладилось."},{"id":"b1u07_5","en":"dramatically","tr":"","ru":"резко, значительно","exEn":"Prices have risen dramatically.","exRu":"Цены резко выросли."},{"id":"b1u07_6","en":"slightly","tr":"","ru":"слегка","exEn":"The price has slightly increased.","exRu":"Цена немного выросла."},{"id":"b1u07_7","en":"steady","tr":"","ru":"стабильный, устойчивый","exEn":"We have steady growth.","exRu":"У нас стабильный рост."},{"id":"b1u07_8","en":"trend","tr":"","ru":"тенденция, тренд","exEn":"This is a new trend in marketing.","exRu":"Это новый тренд в маркетинге."},{"id":"b1u07_9","en":"transform","tr":"","ru":"преобразовывать","exEn":"AI will transform our industry.","exRu":"ИИ преобразит нашу отрасль."},{"id":"b1u07_10","en":"replace","tr":"","ru":"заменять","exEn":"Robots can't replace people.","exRu":"Роботы не могут заменить людей."},{"id":"b1u07_11","en":"affect","tr":"","ru":"влиять на","exEn":"The crisis affected our business.","exRu":"Кризис повлиял на наш бизнес."}]}],"text":{"title":"Десять лет назад","sub":"Интервью","paras":["Journalist: How long have you been running your own agency? — Alex: I've been running it since 2019, so for about six years now.","Journalist: And before that? — Alex: Before that I lived abroad for four years. I worked in Korea, then in Hong Kong and Malaysia. It was a turning point in my life.","Journalist: Was it hard to adapt? — Alex: At first, yes. I was homesick, and there were a few funny misunderstandings. But I got used to the local customs quite quickly.","Journalist: What have you learned from those years? — Alex: That every market is different. What works in Seoul doesn't always work in Novosibirsk. I've never regretted that experience."],"qs":[{"q":"С какого года Алекс руководит агентством?","right":"С 2019","wrong":["С 2015","С 2021"]},{"q":"Сколько лет он прожил за границей?","right":"Четыре года","wrong":["Шесть лет","Один год"]},{"q":"Что было трудным сначала?","right":"Тоска по дому и недопонимания","wrong":["Найти работу","Купить жильё"]},{"q":"Какой главный вывод он сделал?","right":"Каждый рынок отличается","wrong":["Работать за границей не стоит","Везде работает одно и то же"]}]}},{"id":"b1m2","title":"Если…","colors":["#3d8a8f","#1d4a5a"],"grammar":{"title":"Условные предложения 1 и 2 типа","text":"Первый тип — реальное условие в будущем: If + Present Simple, will + глагол. If it rains, we'll stay at home. Второй тип — нереальное или маловероятное условие сейчас: If + Past Simple, would + глагол. If I had more time, I would learn Korean. Во втором типе говорят If I were… для всех лиц.","ex":[["If you call me, I'll answer.","Если позвонишь, я отвечу."],["If I won a million, I would travel.","Если бы я выиграл миллион, я бы путешествовал."],["If I were you, I'd accept the offer.","На твоём месте я бы принял предложение."]],"drills":[{"q":"If it ___ tomorrow, we'll cancel the trip.","ru":"Если завтра пойдёт дождь, отменим поездку.","right":"rains","wrong":["will rain","rained"]},{"q":"If you send the file, I ___ check it today.","ru":"Если пришлёшь файл, я проверю его сегодня.","right":"will","wrong":["would","am"]},{"q":"If I ___ more money, I would buy a house by the sea.","ru":"Если бы у меня было больше денег…","right":"had","wrong":["have","will have"]},{"q":"If I were you, I ___ talk to the boss.","ru":"На твоём месте я бы поговорил с начальником.","right":"would","wrong":["will","am"]},{"q":"What would you do if you ___ the lottery?","ru":"Что бы ты сделал, если бы выиграл в лотерею?","right":"won","wrong":["win","will win"]},{"q":"If we don't hurry, we ___ miss the flight.","ru":"Если не поторопимся, опоздаем на рейс.","right":"will","wrong":["would","are"]},{"q":"If she ___ here, she would help us.","ru":"Если бы она была здесь, она бы нам помогла.","right":"were","wrong":["is","will be"]},{"q":"I ___ buy it if it were cheaper.","ru":"Я бы купил это, если бы было дешевле.","right":"would","wrong":["will","did"]}]},"units":[{"id":"b1u08","tag":"If","title":"Условия","sub":"Если не, на случай, зависит","words":[{"id":"b1u08_0","en":"condition","tr":"","ru":"условие; состояние","exEn":"I'll agree on one condition.","exRu":"Я соглашусь при одном условии."},{"id":"b1u08_1","en":"unless","tr":"","ru":"если не","exEn":"We'll go unless it rains.","exRu":"Мы пойдём, если не будет дождя."},{"id":"b1u08_2","en":"in case","tr":"","ru":"на случай, если","exEn":"Take an umbrella in case it rains.","exRu":"Возьми зонт на случай дождя."},{"id":"b1u08_3","en":"as long as","tr":"","ru":"при условии, что","exEn":"You can come as long as you're on time.","exRu":"Можешь прийти, если не опоздаешь."},{"id":"b1u08_4","en":"otherwise","tr":"","ru":"иначе","exEn":"Hurry, otherwise we'll be late.","exRu":"Поторопись, иначе опоздаем."},{"id":"b1u08_5","en":"likely","tr":"","ru":"вероятный","exEn":"It's likely to rain.","exRu":"Вероятно, будет дождь."},{"id":"b1u08_6","en":"unlikely","tr":"","ru":"маловероятный","exEn":"It's unlikely that he'll come.","exRu":"Вряд ли он придёт."},{"id":"b1u08_7","en":"possible","tr":"","ru":"возможный","exEn":"Is it possible to change the date?","exRu":"Можно ли изменить дату?"},{"id":"b1u08_8","en":"impossible","tr":"","ru":"невозможный","exEn":"It's impossible to finish today.","exRu":"Закончить сегодня невозможно."},{"id":"b1u08_9","en":"certain","tr":"","ru":"уверенный, определённый","exEn":"I'm not certain about the price.","exRu":"Я не уверен насчёт цены."},{"id":"b1u08_10","en":"depend on","tr":"","ru":"зависеть от","exEn":"It depends on the budget.","exRu":"Это зависит от бюджета."},{"id":"b1u08_11","en":"suppose","tr":"","ru":"предполагать","exEn":"I suppose you're right.","exRu":"Полагаю, ты прав."}]},{"id":"b1u09","tag":"Money","title":"Деньги в жизни","sub":"Кредит, ипотека, налог","words":[{"id":"b1u09_0","en":"afford","tr":"","ru":"позволить себе","exEn":"I can't afford a new car.","exRu":"Я не могу позволить себе новую машину."},{"id":"b1u09_1","en":"loan","tr":"","ru":"кредит, заём","exEn":"We took a loan from the bank.","exRu":"Мы взяли кредит в банке."},{"id":"b1u09_2","en":"debt","tr":"","ru":"долг","exEn":"The company has no debt.","exRu":"У компании нет долгов."},{"id":"b1u09_3","en":"savings","tr":"","ru":"сбережения","exEn":"I keep my savings in different currencies.","exRu":"Я храню сбережения в разных валютах."},{"id":"b1u09_4","en":"interest","tr":"","ru":"проценты; интерес","exEn":"The interest rate is high.","exRu":"Процентная ставка высокая."},{"id":"b1u09_5","en":"mortgage","tr":"","ru":"ипотека","exEn":"We pay a mortgage every month.","exRu":"Мы каждый месяц платим ипотеку."},{"id":"b1u09_6","en":"lottery","tr":"","ru":"лотерея","exEn":"I never play the lottery.","exRu":"Я никогда не играю в лотерею."},{"id":"b1u09_7","en":"wealthy","tr":"","ru":"богатый, состоятельный","exEn":"He comes from a wealthy family.","exRu":"Он из состоятельной семьи."},{"id":"b1u09_8","en":"poor","tr":"","ru":"бедный; плохой","exEn":"The quality was poor.","exRu":"Качество было плохим."},{"id":"b1u09_9","en":"currency","tr":"","ru":"валюта","exEn":"What currency do they use in Malaysia?","exRu":"Какая валюта в Малайзии?"},{"id":"b1u09_10","en":"exchange rate","tr":"","ru":"курс обмена","exEn":"The exchange rate i exEn":"In theory, it should work.","exRu":"В теории это должно сработать."},{"id":"b1u14_6","en":"in practice","tr":"","ru":"на практике","exEn":"In practice, it's more difficult.","exRu":"На практике всё сложнее."},{"id":"b1u14_7","en":"estimate","tr":"","ru":"оценка, оценивать","exEn":"Can you estimate the cost?","exRu":"Можешь оценить стоимость?"},{"id":"b1u14_8","en":"approximately","tr":"","ru":"приблизительно","exEn":"It costs approximately two thousand dollars.","exRu":"Это стоит примерно две тысячи долларов."},{"id":"b1u14_9","en":"exactly","tr":"","ru":"точно, именно","exEn":"That's exactly what I mean.","exRu":"Именно это я и имею в виду."},{"id":"b1u14_10","en":"definitely","tr":"","ru":"определённо","exEn":"I'll definitely come.","exRu":"Я точно приду."},{"id":"b1u14_11","en":"perhaps","tr":"","ru":"возможно, пожалуй","exEn":"Perhaps we should wait.","exRu":"Пожалуй, нам стоит подождать."}]}],"text":{"title":"Что, если?","sub":"Колонка предпринимателя","paras":["Every entrepreneur asks the same question: what if? What if we open a second office? What if the market changes?","Last year we had two options. If we opened an office in Moscow, we would get bigger clients, but the rent would eat most of our profit. If we stayed in Novosibirsk, growth would be slower, but much safer.","We weighed up the pros and cons and chose a third option: a small remote team in Moscow. If it works, we will open a real office next year. If it doesn't, we will lose very little.","My advice: always have a backup plan, and don't hesitate to take a small risk before a big one."],"qs":[{"q":"Какой минус был у офиса в Москве?","right":"Аренда съела бы большую часть прибыли","wrong":["Там мало клиентов","Нет сотрудников"]},{"q":"Какой вариант выбрала компания?","right":"Небольшую удалённую команду в Москве","wrong":["Большой офис в Москве","Ничего не менять"]},{"q":"Что будет, если план сработает?","right":"В следующем году откроют настоящий офис","wrong":["Закроют офис в Новосибирске","Продадут компанию"]},{"q":"Какой совет даёт автор?","right":"Иметь запасной план и начинать с небольшого риска","wrong":["Никогда не рисковать","Всегда открывать офис в столице"]}]}},{"id":"b1m3","title":"Деловая переписка","colors":["#6a63b0","#2e2c6a"],"grammar":{"title":"Вежливые просьбы и косвенные вопросы","text":"В деловом английском прямые просьбы звучат резко. Смягчаем их: Could you…? Would you mind + -ing? I was wondering if… Косвенный вопрос: вместо Where is the office? — Could you tell me where the office is? Во второй части порядок слов как в обычном утверждении, без do и does.","ex":[["Could you send me the invoice?","Не могли бы вы прислать счёт?"],["Would you mind calling back later?","Не могли бы вы перезвонить позже?"],["Could you tell me when the meeting starts?","Не подскажете, когда начинается встреча?"]],"drills":[{"q":"___ you send me the report by Friday?","ru":"Не могли бы вы прислать отчёт до пятницы?","right":"Could","wrong":["Must","Should"]},{"q":"Would you mind ___ the door?","ru":"Не могли бы вы закрыть дверь?","right":"closing","wrong":["close","to close"]},{"q":"Could you tell me where ___?","ru":"Не подскажете, где вокзал?","right":"the station is","wrong":["is the station","does the station"]},{"q":"I was wondering ___ you could help me.","ru":"Я хотел узнать, не могли бы вы мне помочь.","right":"if","wrong":["that","what"]},{"q":"Do you know what time ___?","ru":"Вы не знаете, во сколько открывается магазин?","right":"the shop opens","wrong":["does the shop open","opens the shop"]},{"q":"___ you like to join us for dinner?","ru":"Не хотите поужинать с нами?","right":"Would","wrong":["Will","Do"]},{"q":"Would you mind if I ___ the window?","ru":"Вы не против, если я открою окно?","right":"opened","wrong":["will open","am opening"]},{"q":"Could you ___ me know by Monday?","ru":"Дайте мне знать до понедельника.","right":"let","wrong":["make","tell"]}]},"units":[{"id":"b1u15","tag":"Mail","title":"Деловое письмо","sub":"Относительно, вложение, жду ответа","words":[{"id":"b1u15_0","en":"regarding","tr":"","ru":"относительно","exEn":"I'm writing regarding your order.","exRu":"Пишу по поводу вашего заказа."},{"id":"b1u15_1","en":"enclosed","tr":"","ru":"приложенный","exEn":"Please find the contract enclosed.","exRu":"Договор во вложении."},{"id":"b1u15_2","en":"attachment","tr":"","ru":"вложение","exEn":"See the attachment.","exRu":"Смотрите вложение."},{"id":"b1u15_3","en":"forward","tr":"","ru":"пересылать; вперёд","exEn":"I'll forward you his email.","exRu":"Я перешлю тебе его письмо."},{"id":"b1u15_4","en":"cc","tr":"","ru":"поставить в копию","exEn":"Please cc my assistant.","exRu":"Пожалуйста, поставьте в копию моего ассистента."},{"id":"b1u15_5","en":"follow up","tr":"","ru":"напомнить о себе, продолжить","exEn":"I'm following up on my last email.","exRu":"Пишу по поводу моего прошлого письма."},{"id":"b1u15_6","en":"look forward to","tr":"","ru":"с нетерпением ждать","exEn":"I look forward to hearing from you.","exRu":"Жду вашего ответа."},{"id":"b1u15_7","en":"as soon as possible","tr":"","ru":"как можно скорее","exEn":"Please reply as soon as possible.","exRu":"Пожалуйста, ответьте как можно скорее."},{"id":"b1u15_8","en":"at your earliest convenience","tr":"","ru":"при первой возможности","exEn":"Please call me at your earliest convenience.","exRu":"Позвоните мне при первой возможности."},{"id":"b1u15_9","en":"kind regards","tr":"","ru":"с наилучшими пожеланиями","exEn":"Kind regards, Alex.","exRu":"С наилучшими пожеланиями, Алекс."},{"id":"b1u15_10","en":"inquiry","tr":"","ru":"запрос","exEn":"Thank you for your inquiry.","exRu":"Спасибо за ваш запрос."},{"id":"b1u15_11","en":"request","tr":"","ru":"просьба, запрос","exEn":"We received your request.","exRu":"Мы получили вашу заявку."}]},{"id":"b1u16","tag":"Pls","title":"Просьбы и ответы","sub":"Буду признателен, уточнить, от имени","words":[{"id":"b1u16_0","en":"would you mind","tr":"","ru":"не могли бы вы","exEn":"Would you mind w ":"","ru":"в тот момент","exEn":"At that moment, the phone rang.","exRu":"В тот момент зазвонил телефон."},{"id":"b1u22_6","en":"all of a sudden","tr":"","ru":"внезапно","exEn":"All of a sudden, everything went dark.","exRu":"Внезапно всё погрузилось во тьму."},{"id":"b1u22_7","en":"it turned out","tr":"","ru":"оказалось","exEn":"It turned out he was right.","exRu":"Оказалось, он был прав."},{"id":"b1u22_8","en":"ending","tr":"","ru":"концовка","exEn":"The ending was a surprise.","exRu":"Концовка была неожиданной."},{"id":"b1u22_9","en":"flashback","tr":"","ru":"воспоминание (в сюжете), флешбэк","exEn":"The film has many flashbacks.","exRu":"В фильме много флешбэков."},{"id":"b1u22_10","en":"describe","tr":"","ru":"описывать","exEn":"Describe what happened.","exRu":"Опиши, что произошло."},{"id":"b1u22_11","en":"apparently","tr":"","ru":"судя по всему","exEn":"Apparently, the meeting was cancelled.","exRu":"Судя по всему, встречу отменили."}]},{"id":"b1u23","tag":"News","title":"Происшествия","sub":"Свидетель, украсть, спасти","words":[{"id":"b1u23_0","en":"incident","tr":"","ru":"происшествие, инцидент","exEn":"There was an incident at the airport.","exRu":"В аэропорту произошёл инцидент."},{"id":"b1u23_1","en":"witness","tr":"","ru":"свидетель","exEn":"Were there any witnesses?","exRu":"Были свидетели?"},{"id":"b1u23_2","en":"steal","tr":"","ru":"красть","exEn":"Someone stole my bike.","exRu":"Кто-то украл мой велосипед."},{"id":"b1u23_3","en":"rob","tr":"","ru":"грабить","exEn":"The shop was robbed last night.","exRu":"Магазин ограбили прошлой ночью."},{"id":"b1u23_4","en":"thief","tr":"","ru":"вор","exEn":"The thief ran away.","exRu":"Вор убежал."},{"id":"b1u23_5","en":"injure","tr":"","ru":"ранить, травмировать","exEn":"Two people were injured.","exRu":"Два человека пострадали."},{"id":"b1u23_6","en":"rescue","tr":"","ru":"спасать","exEn":"Firefighters rescued the family.","exRu":"Пожарные спасли семью."},{"id":"b1u23_7","en":"flood","tr":"","ru":"наводнение"," ."}]}],"text":{"title":"Кофейня, которая выжила","sub":"История малого бизнеса","paras":["My friend Olga owns a small coffee shop in the center of Novosibirsk. It's the place where I usually have meetings with clients.","Two years ago the business was in trouble. The rent, which went up every year, was eating all the profit, and the coffee supplier who had worked with her for years suddenly raised his prices.","Olga didn't give up. She found a local roaster whose coffee was cheaper and better, and she started selling coffee beans online. Customers who had loved the café became loyal online buyers.","Today the online shop brings in forty percent of the revenue, and the café has finally broken even."],"qs":[{"q":"Кто такая Ольга?","right":"Владелица кофейни","wrong":["Бухгалтер","Клиентка Алекса"]},{"q":"Почему бизнес был в беде?","right":"Росла аренда и поставщик поднял цены","wrong":["Ушли сотрудники","Закрыли улицу"]},{"q":"Что сделала Ольга?","right":"Нашла местного обжарщика и начала продавать зерно онлайн","wrong":["Закрыла кафе","Взяла кредит"]},{"q":"Какую часть выручки даёт интернет-магазин?","right":"Сорок процентов","wrong":["Десять процентов","Всю выручку"]}]}},{"id":"b1m8","title":"Мнения","colors":["#3f6e9e","#1b3350"],"grammar":{"title":"Герундий или инфинитив","text":"После одних глаголов идёт форма с -ing: enjoy, avoid, finish, mind, suggest, keep. I enjoy working with people. После других — to + глагол: want, decide, plan, hope, agree, afford. We decided to expand. После предлогов всегда -ing: interested in learning, good at selling. У stop смысл меняется: stop smoking — бросить курить, stop to smoke — остановиться, чтобы покурить.","ex":[["I enjoy meeting new people.","Мне нравится знакомиться с новыми людьми."],["We decided to hire a designer.","Мы решили нанять дизайнера."],["She's good at negotiating.","Она хорошо ведёт переговоры."]],"drills":[{"q":"I enjoy ___ with clients.","ru":"Мне нравится работать с клиентами.","right":"working","wrong":["to work","work"]},{"q":"We decided ___ a new office.","ru":"Мы решили открыть новый офис.","right":"to open","wrong":["opening","open"]},{"q":"He's interested in ___ Korean.","ru":"Ему интересно учить корейский.","right":"learning","wrong":["to learn","learn"]},{"q":"They agreed ___ the price.","ru":"Они согласились снизить цену.","right":"to reduce","wrong":["reducing","reduce"]},{"q":"Have you finished ___ the report?","ru":"Ты закончил писать отчёт?","right":"writing","wrong":["to write","write"]},{"q":"I can't afford ___ a new car.","ru":"Я не могу позволить себе новую машину.","right":"to buy","wrong":["buying","buy"]},{"q":"She suggested ___ the meeting.","ru":"Она предложила перенести встречу.","right":"postponing","wrong":["to postpone","postpone"]},{"q":"He stopped ___ two years ago.","ru":"Он бросил курить два года назад.","right":"smoking","wrong":["to smoke","smoke"]}]},"units":[{"id":"b1u50","tag":"IMO","title":"Своё мнение","sub":"По-моему, честно говоря, с другой стороны","words":[{"id":"b1u50_0","en":"in my opinion","tr":"","ru":"по-моему","exEn":"In my opinion, the price is too high.","exRu":"По-моему, цена слишком высокая."},{"id":"b1u50_1","en":"from my point of view","tr":"","ru":"с моей точки зрения","exEn":"From my point of view, it's a good idea.","exRu":"С моей точки зрения, это хорошая идея."},{"id":"b1u50_2","en":"as far as I know","tr":"","ru":"насколько я знаю","exEn":"As far as I know, he's on vacation.","exRu":"Насколько я знаю, он в отпуске."},{"id":"b1u50_3","en":"I believe","tr":"","ru":"я считаю","exEn":"I believe we can do it.","exRu":"Я считаю, мы справимся."},{"id":"b1u50_4","en":"to be honest","tr":"","ru":"честно говоря","exEn":"To be honest, I don't like it.","exRu":"Честно говоря, мне это не нравится."},{"id":"b1u50_5","en":"personally","tr":"","ru":"лично (я)","exEn":"Personally, I prefer tea.","exRu":"Лично я предпочитаю чай."},{"id":"b1u50_6","en":"it seems to me","tr":"","ru":"мне кажется","exEn":"It seems to me that he's :"On the contrary, sales have grown.","exRu":"Напротив, продажи выросли."},{"id":"b1u51_8","en":"debate","tr":"","ru":"дебаты, обсуждать","exEn":"There was a long debate about the budget.","exRu":"Был долгий спор о бюджете."},{"id":"b1u51_9","en":"controversial","tr":"","ru":"спорный","exEn":"It's a controversial decision.","exRu":"Это спорное решение."},{"id":"b1u51_10","en":"consensus","tr":"","ru":"консенсус, общее согласие","exEn":"We reached a consensus.","exRu":"Мы пришли к согласию."},{"id":"b1u51_11","en":"object to","tr":"","ru":"возражать против","exEn":"I object to this plan.","exRu":"Я возражаю против этого плана."}]},{"id":"b1u52","tag":"-ing","title":"Глаголы с -ing","sub":"Избегать, бросить, откладывать","words":[{"id":"b1u52_0","en":"enjoy","tr":"","ru":"наслаждаться, получать удовольствие","exEn":"I enjoy working with people.","exRu":"Мне нравится работать с людьми."},{"id":"b1u52_1","en":"avoid","tr":"","ru":"избегать","exEn":"Avoid making promises you can't keep.","exRu":"Не давай обещаний, которые не сможешь выполнить."},{"id":"b1u52_2","en":"keep","tr":"","ru":"продолжать (keep doing); хранить","exEn":"Keep trying!","exRu":"Продолжай пытаться!"},{"id":"b1u52_3","en":"give up","tr":"","ru":"бросить, сдаться","exEn":"Don't give up!","exRu":"Не сдавайся!"},{"id":"b1u52_4","en":"can't stand","tr":"","ru":"терпеть не могу","exEn":"I can't stand waiting.","exRu":"Терпеть не могу ждать."},{"id":"b1u52_5","en":"feel like","tr":"","ru":"хотеться","exEn":"I feel like going out tonight.","exRu":"Мне хочется куда-нибудь сходить вечером."},{"id":"b1u52_6","en":"be used to","tr":"","ru":"быть привычным к","exEn":"I'm used to working late.","exRu":"Я привык работать допоздна."},{"id":"b1u52_7","en":"it's worth","tr":"","ru":"стоит (делать)","exEn":"It's worth visiting this museum.","exRu":"В этот музей стоит сходить."},{"id":"b1u52_8","en":"no point in","tr":"","ru":"нет смысла","exEn":"There's no point in waiting.","exRu":"Нет смысла ждать."},{"id":"b1u52_9",
