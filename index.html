}

/* ===================== EXERCISES ===================== */
const root=s=>s.toLowerCase().split(/[ ,(]/)[0];
function distract(w,field,n=3){
  const ok=x=>x.id!==w.id&&x.en!==w.en&&root(x.ru)!==root(w.ru);
  const pool=shuffle(ALL.filter(ok));
  const near=pool.filter(x=>x.unit===w.unit), mod=pool.filter(x=>x.mod===w.mod&&x.unit!==w.unit), far=pool.filter(x=>x.mod!==w.mod);
  const out=[], seen=new Set([root(w.ru),w[field].toLowerCase()]);
  for(const x of [...near,...mod,...far]){const k1=root(x.ru),k2=x[field].toLowerCase();if(seen.has(k1)||seen.has(k2))continue;seen.add(k1);seen.add(k2);out.push(x[field]);if(out.length===n)break}
  return out;
}
function makeEx(t,w){
  if(t==='listen'&&!TTS) t='pick';
  if(t==='build'){
    const toks=w.exEn.split(' ');
    if(toks.length<3||toks.length>8) t='pick';
    else{let o=shuffle(toks.map((x,i)=>i));if(o.every((x,i)=>x===i))o.reverse();return {t,w,toks,order:o,ans:[]}}
  }
  const field=t==='pick'?'ru':'en', right=w[field];
  return {t,w,opts:shuffle([right,...distract(w,field)]),right};
}
const makeGap=d=>({t:'gap',d,opts:shuffle([d.right,...d.wrong]),right:d.right});
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function clozeOf(w){const re=new RegExp('(^|[^A-Za-z])('+reEsc(w.en)+')(?![A-Za-z])','i');const m=w.exEn.match(re);return m?w.exEn.replace(re,'$1___'):null}
function makeCloze(w){const q=w.level!=='A1'&&clozeOf(w);if(!q)return makeEx('reverse',w);return {t:'cloze',w,q,opts:shuffle([w.en,...distract(w,'en')]),right:w.en}}
function startText(mid){
  const m=ALL_MODS[mid], tx=m.text;
  const qs=tx.qs.map(q=>({t:'tq',q:q.q,opts:shuffle([q.right,...q.wrong]),right:q.right}));
  L={kind:'text',title:'Текст',m,words:[],steps:[{t:'read',m},...qs],i:0,state:null,correct:0,asked:0,xp:0};
  go('lesson');
}

function startUnit(uid){
  const u=ALL_UNITS[uid], fresh=u.words.filter(w=>!S.learned[w.id]).slice(0,LESSON_SIZE);
  const practice=!fresh.length, words=practice?shuffle(u.words).slice(0,6):fresh;
  const steps=practice?[]:fresh.map(w=>({t:'learn',w}));
  const ex=[]; words.forEach((w,i)=>{ex.push(makeEx('pick',w));ex.push(i%2?makeEx('listen',w):(w.level==='A1'?makeEx('reverse',w):makeCloze(w)))});
  shuffle(words).slice(0,2).forEach(w=>ex.push(makeEx('build',w)));
  steps.push(...shuffle(ex));
  L={kind:practice?'practice':'unit',title:u.title,u,words:fresh,steps,i:0,state:null,correct:0,asked:0,xp:0};
  go('lesson');
}
function startGrammar(mid){
  const m=ALL_MODS[mid];
  L={kind:'grammar',title:'Грамматика',m,words:[],steps:[{t:'rule',m},...shuffle(m.grammar.drills).map(makeGap)],i:0,state:null,correct:0,asked:0,xp:0};
  go('lesson');
}
function startTest(lid){
  const lv=LEVELS.find(l=>l.id===lid), ws=shuffle(ALL.filter(w=>w.level===lid)).slice(0,14);
  const ds=shuffle(lv.modules.flatMap(m=>m.grammar.drills)).slice(0,TEST_LEN-ws.length);
  const steps=shuffle([...ws.map(w=>makeEx(Math.random()<.5?'pick':'reverse',w)),...ds.map(makeGap)]);
  L={kind:'test',title:'Тест '+lid,lv,words:[],steps,i:0,state:null,correct:0,asked:0,xp:0,noRetry:true};
  go('lesson');
}
const ALL_UNITS={}, ALL_MODS={};
LEVELS.forEach(l=>l.modules.forEach(m=>{ALL_MODS[m.id]=m;m.units.forEach(u=>ALL_UNITS[u.id]=u)}));

/* ===================== LESSON VIEW ===================== */
function lessonHTML(){
  const st=L.steps[L.i];
  return `<header class="pad">
    <div class="shead"><button class="circle-btn" data-act="exit" aria-label="Выйти">${I.back}</button><h1>${esc(L.title)}</h1><span class="chip">${L.i+1}/${L.steps.length}</span></div>
    <div class="progress"><i style="width:${L.i/L.steps.length*100}%"></i></div></header>
    <section class="sheet flex"><div class="stage pad">${stepHTML(st)}</div></section>`;
}
function footHTML(st){
  if(st.t==='rule') return `<div class="foot"><button class="btn gold" data-act="next">К упражнениям</button></div>`;
  if(st.t==='learn') return `<div class="foot"><button class="btn gold" data-act="next">Дальше</button></div>`;
  if(st.t==='read') return `<div class="foot"><button class="btn gold" data-act="next">К вопросам</button></div>`;
  if(!L.state) return st.t==='build'?`<div class="foot"><button class="btn gold" data-act="checkBuild" ${st.ans.length?'':'disabled'}>Проверить</button></div>`:'';
  const ok=L.state==='ok';
  let detail;
  if(st.t==='gap') detail=st.d.q.replace('___',st.d.right);
  else if(st.t==='cloze') detail=st.w.exEn+' — '+st.w.ru;
  else if(st.t==='tq') detail=st.right;
  else if(st.t==='build') detail=st.w.exEn;
  else detail=st.w.en+' — '+st.w.ru;
  const xp=L.kind==='test'?'':` +${st.retry?5:10} XP`;
  return `<div class="foot"><div class="fb ${ok?'ok':'no'}">${ok?'Верно!'+xp:'Почти. Правильно так:'}<small>${esc(detail)}</small></div>
    <button class="btn ${ok?'gold':'navy'}" data-act="next">Дальше</button></div>`;
}
function optsHTML(st){
  return `<div class="opts">${st.opts.map(o=>{let c='';if(L.state){if(o===st.right)c='ok';else if(o===st.chosen)c='no'}
    return `<button class="opt ${c}" data-act="answer" data-o="${esc(o)}" ${L.state?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
}
function stepHTML(st){
  if(st.t==='rule'){
    const g=st.m.grammar;
    return `<p class="q-label">Модуль ${st.m.n} · ${esc(st.m.title)}</p>
    <div class="gram"><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p>
      <ul>${g.ex.map(e=>`<li><b>${esc(e[0])} ${spkBtn(e[0],'sm')}</b><span>${esc(e[1])}</span></li>`).join('')}</ul></div>${footHTML(st)}`;
  }
  if(st.t==='read'){
    const tx=st.m.text, all=tx.paras.join(' ');
    return `<p class="q-label">Текст · ${esc(st.m.title)}</p><div class="gram reading"><h3>${esc(tx.title)}</h3>
      <div class="listen-all">${spkBtn(all)}<span>${TTS?'Слушать весь текст':''}</span></div>
      ${tx.paras.map(p=>`<p>${esc(p)} ${spkBtn(p,'sm')}</p>`).join('')}</div>
      <p class="hint">Прочитай или прослушай, а потом ответь на ${tx.qs.length} вопроса.</p>${footHTML(st)}`;
  }
  if(st.t==='cloze'){
    const [a,b]=st.q.split('___'), fill=L.state?`<span class="gap ${L.state}">${esc(st.chosen)}</span>`:'<span class="gap">&nbsp;</span>';
    return `<p class="q-label">Вставь слово</p><p class="prompt" style="font-size:22px;display:block">${esc(a)}${fill}${esc(b)}</p>
      <p class="hint">${esc(st.w.exRu)}</p>${optsHTML(st)}${footHTML(st)}`;
  }
  if(st.t==='tq'){
    return `<p class="q-label">Вопрос по тексту · ${esc(L.m.text.title)}</p><p class="prompt" style="font-size:21px">${esc(st.q)}</p>
      <div class="opts" style="grid-template-columns:1fr">${optsHTML(st).replace('<div class="opts">','').replace(/<\/div>$/,'')}</div>${footHTML(st)}`;
  }
  if(st.t==='learn'){
    const w=st.w;
    return `<p class="q-label">Новое слово</p><div class="wcard">
      <div class="word">${esc(w.en)} ${spkBtn(w.en)}</div>${w.tr?`<div class="tr">[${esc(w.tr)}] · примерное звучание</div>`:`<div class="tr">${TTS?'Нажми на динамик, чтобы послушать':''}</div>`}
      <div class="ru">${esc(w.ru)}</div>
      <div class="ex"><span class="en">${esc(w.exEn)} ${spkBtn(w.exEn,'sm')}</span><span class="rus">${esc(w.exRu)}</span></div></div>${footHTML(st)}`;
  }
  if(st.t==='gap'){
    const [a,b]=st.d.q.split('___'), fill=L.state?`<span class="gap ${L.state}">${esc(st.chosen)}</span>`:'<span class="gap">&nbsp;</span>';
    return `<p class="q-label">Вставь пропуск</p><p class="prompt" style="font-size:23px;display:block">${esc(a)}${fill}${esc(b)}</p>
      <p class="hint">${esc(st.d.ru)}</p>${optsHTML(st)}${footHTML(st)}`;
  }
  if(st.t==='build'){
    const ans=st.ans.map((ti,k)=>`<button class="tok" data-act="unpick" data-k="${k}" ${L.state?'disabled':''}>${esc(st.toks[ti])}</button>`).join('');
    const bank=st.order.map(ti=>`<button class="tok ${st.ans.includes(ti)?'used':''}" data-act="pickTok" data-ti="${ti}" ${L.state?'disabled':''}>${esc(st.toks[ti])}</button>`).join('');
    return `<p class="q-label">Собери фразу</p><p class="prompt" style="font-size:22px">${esc(st.w.exRu)}</p>
      <div class="answer">${ans}</div><div class="bank">${bank}</div>${footHTML(st)}`;
  }
  const label={pick:'Как переводится?',reverse:'Выбери перевод',listen:'Что прозвучало?'}[st.t];
  const head=st.t==='pick'?`<p class="prompt">${esc(st.w.en)} ${L.kind==='test'?'':spkBtn(st.w.en)}</p>`
    :st.t==='reverse'?`<p class="prompt">${esc(st.w.ru)}</p>`:spkBtn(st.w.en,'xl');
  return `<p class="q-label">${label}</p>${head}${optsHTML(st)}${footHTML(st)}`;
}
function grade(ok){
  const st=L.steps[L.i];
  L.asked++; L.state=ok?'ok':'no';
  if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.notificationOccurred(ok?'success':'error')}catch(e){}}
  if(ok){L.correct++; if(L.kind!=='test'){const g=st.retry?5:10;L.xp+=g;addXP(g)} if(st.w&&st.t!=='build'&&L.kind!=='test')speak(st.t==='cloze'?st.w.exEn:st.w.en)}
  else if(!L.noRetry&&!st.retry){const c=st.t==='gap'?makeGap(st.d):st.t==='tq'?{...st,opts:shuffle(st.opts),chosen:null}:st.t==='cloze'?makeCloze(st.w):makeEx(st.t,st.w);c.retry=true;L.steps.push(c)}
  render();
}
function nextStep(){
  L.state=null; L.i++;
  if(L.i>=L.steps.length) return finish();
  render(); window.scrollTo(0,0);
}
function finish(){
  const t=dnum();
  if(L.kind==='unit') L.words.forEach(w=>{if(!S.learned[w.id])S.learned[w.id]={iv:1,ef:2.5,reps:1,due:t+1}});
  if(L.kind==='grammar') S.gram[L.m.id]=true;
  if(L.kind==='text') S.texts[L.m.id]=true;
  if(L.kind==='test'){
    L.score=Math.round(L.correct/L.asked*100);
    if(L.score>=PASS){S.passed[L.lv.id]=Math.max(S.passed[L.lv.id]||0,L.score);addXP(50);L.xp=50}
  } else {const b=L.kind==='practice'?5:20;addXP(b);L.xp+=b}
  save(); view='done'; render(); window.scrollTo(0,0);
}
function doneHTML(){
  const acc=L.asked?Math.round(L.correct/L.asked*100):100, next=nextAction();
  const nextBtn=next?`<button class="btn gold" data-act="${next.it.t==='unit'?'unit':next.it.t}" data-m="${next.it.m?next.it.m.id:''}" data-u="${next.it.u?next.it.u.id:''}" data-l="${next.lv.id}">Следующий шаг</button>`:'';
  let title, sub, body='';
  if(L.kind==='test'){
    const pass=L.score>=PASS, nx=ALL_LV[ALL_LV.indexOf(L.lv.id)+1];
    title=pass?`Уровень ${L.lv.id} сдан`:'Пока не хватает';
    sub=pass?(nx?`Открыт уровень ${nx}.`:'Это последний готовый уровень.'):`Нужно ${PASS}%. Повтори слабые модули и попробуй снова.`;
    body=`<div class="empty" style="margin-bottom:18px"><span class="score">${L.score}%</span><p>${L.correct} из ${L.asked} верно</p></div>`;
  } else if(L.kind==='grammar'){ title='Правило разобрано'; sub=`${esc(L.m.grammar.title)} · ${acc}% верно`; }
  else if(L.kind==='text'){ title='Текст прочитан'; sub=`${esc(L.m.text.title)} · ${acc}% верно`; }
  else if(L.kind==='practice'){ title='Повторено'; sub=`${esc(L.u.title)} · ${acc}% верно`; }
  else { title='Урок пройден'; sub=`${L.words.length} ${plural(L.words.length,'новое слово','новых слова','новых слов')} уже в повторении на завтра`;
    body=`<ul class="wlist">${L.words.map(w=>`<li>${spkBtn(w.en,'sm')||'<span></span>'}<div><b>${esc(w.en)}</b><span>${esc(w.ru)}</span></div></li>`).join('')}</ul>`; }
  return `<header class="pad done-hero"><div class="medal">${I.star}</div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p></header>
  ${L.kind==='test'?'':`<div class="tiles pad"><div class="glass tile"><span class="lbl">Получено</span><b>+${L.xp} XP</b></div><div class="glass tile"><span class="lbl">Точность</span><b>${acc}%</b></div></div>`}
  <section class="sheet"><div class="pad">${body}
    <div style="display:flex;flex-direction:column;gap:10px">${nextBtn}<button class="btn ghost" data-act="tab" data-v="home">На главную</button></div>
  </div></section>`;
}

/* ===================== REVIEW (SM-2) ===================== */
function nextIv(e,g){if(g===0)return 0;if(g===1)return Math.max(1,Math.round(e.iv*1.2));if(g===2)return e.reps<=1?3:Math.round(e.iv*e.ef);return Math.round((e.reps<=1?4:e.iv*e.ef)*1.3)}
const ivLabel=n=>n===0?'сейчас':n<30?`${n} д`:`${Math.round(n/30)} мес`;
function reviewHTML(){
  if(!R) R={q:shuffle(dueIds()).slice(0,30),shown:false,done:0,flip:Math.random()<.5};
  const next=nextAction(); let body;
  const nextBtn=next?`<button class="btn gold" style="margin-top:8px" data-act="tab" data-v="home">К курсу</button>`:'';
  if(!R.q.length){
    const ids=Object.keys(S.learned);
    if(!ids.length) body=`<div class="empty"><h3>Здесь появятся твои слова</h3><p>Пройди первый урок. Каждое новое слово вернётся сюда в нужный день.</p>${nextBtn}</div>`;
    else{const nx=Math.min(...ids.map(id=>S.learned[id].due))-dnum();
      body=`<div class="empty"><h3>${R.done?`Повторено: ${R.done}`:'На сегодня всё'}</h3><p>Следующее повторение ${nx<=1?'завтра':`через ${nx} ${plural(nx,'день','дня','дней')}`}. А пока можно пройти новый урок.</p>${nextBtn}</div>`}
  } else {
    const w=BYID[R.q[0]], e=S.learned[w.id];
    const back=`<div class="ex"><span class="en">${esc(w.en)} ${spkBtn(w.en,'sm')}</span><span class="rus">${w.tr?`[${esc(w.tr)}] · `:''}${esc(w.ru)}</span>
      <span class="en" style="margin-top:8px;font-size:15px">${esc(w.exEn)}</span><span class="rus">${esc(w.exRu)}</span></div>`;
    body=`<p class="q-label">${R.flip?'Вспомни по-английски':'Вспомни перевод'} · осталось ${R.q.length}</p>
      <div class="flash"><div class="word" style="justify-content:center">${R.flip?esc(w.ru):esc(w.en)} ${R.flip?'':spkBtn(w.en)}</div>${R.shown?back:''}</div>
      <div class="foot">${R.shown?`<div class="grades">${['Забыл','Трудно','Хорошо','Легко'].map((t,g)=>`<button class="grade g${g}" data-act="rate" data-g="${g}">${t}<small>${ivLabel(nextIv(e,g))}</small></button>`).join('')}</div>`
        :`<button class="btn gold" data-act="show">Показать ответ</button>`}</div>`;
  }
  return `<header class="pad"><div class="shead"><span></span><h1>Повторение</h1><span class="chip">${dueIds().length}</span></div></header>
    <section class="sheet flex"><div class="stage pad">${body}</div></section>`;
}
function rate(g){
  const id=R.q.shift(), e=S.learned[id], t=dnum();
  if(g===0){e.ef=Math.max(1.3,e.ef-.2);e.iv=1;e.reps=0;e.due=t;R.q.push(id)}
  else{e.iv=nextIv(e,g);if(g===1)e.ef=Math.max(1.3,e.ef-.15);if(g===3)e.ef+=.15;e.reps++;e.due=t+e.iv;R.done++;addXP(5)}
  save();R.shown=false;R.flip=Math.random()<.5;render();
}

/* ===================== STATS ===================== */
function statsHTML(){
  const n=learnedCount(), strong=Object.values(S.learned).filter(e=>e.iv>=21).length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const vals=days.map(d=>S.days[dkey(d)]||0), max=Math.max(GOAL,...vals), names=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const lv=LEVELS.find(l=>l.id===activeLevel())||LEVELS[0], list=items(lv);
  return `<header class="pad"><div class="shead"><span></span><h1>Прогресс</h1><span></span></div></header>
  <div class="tiles pad">
    <div class="glass tile"><span class="lbl">Всего XP</span><b>${S.xp}</b></div>
    <div class="glass tile"><span class="lbl">Серия</span><b>${streak()} ${plural(streak(),'день','дня','дней')}</b></div>
    <div class="glass tile"><span class="lbl">Выучено слов</span><b>${n}</b></div>
    <div class="glass tile"><span class="lbl">Закреплено</span><b>${strong}</b></div>
  </div>
  <section class="sheet"><div class="pad">
    <div class="week"><h3>XP за неделю · цель ${GOAL} в день</h3>
      <div class="bars">${vals.map((v,i)=>`<div class="${i===6?'today':''}"><span>${v||''}</span><i style="height:${v/max*85}%"></i></div>`).join('')}</div>
      <div class="days">${days.map(d=>`<span>${names[d.getDay()]}</span>`).join('')}</div></div>
    <div class="ulist"><h3>Уровень ${lv.id} по модулям</h3>${lv.modules.map(m=>{const its=list.filter(x=>x.m===m),d=its.filter(itemDone).length;
      return `<div class="urow"><b>${m.n}. ${esc(m.title)}</b><span>${d}/${its.length}</span><div class="bar"><i style="width:${d/its.length*100}%"></i></div></div>`}).join('')}</div>
    <div class="reset">${confirmReset?`<div class="confirm"><span>Стереть весь прогресс?</span><button class="btn navy" style="width:auto" data-act="doReset">Да, стереть</button><button style="width:auto" class="btn ghost" data-act="cancelReset">Отмена</button></div>`
      :`<button data-act="askReset">Сбросить прогресс</button>`}</div>
    <p style="text-align:center;font-size:12px;color:var(--ink-soft);margin:14px 0 0">«Закреплено» — слова с интервалом повторения от 21 дня</p>
  </div></section>`;
}

/* ===================== EVENTS ===================== */
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, st=L&&L.steps[L.i];
  if(a==='say') return speak(b.dataset.t);
  if(a==='tab') return go(b.dataset.v);
  if(a==='lvl'){S.lvl=b.dataset.l;save();return render()}
  if(a==='toggle'){const m=b.dataset.m,cur=b.parentElement.classList.contains('open');S.open[m]=!cur;save();return render()}
  if(a==='unit') return startUnit(b.dataset.u);
  if(a==='grammar') return startGrammar(b.dataset.m);
  if(a==='text') return startText(b.dataset.m);
  if(a==='test') return startTest(b.dataset.l);
  if(a==='exit'){L=null;return go('home')}
  if(a==='next') return nextStep();
  if(a==='answer'){st.chosen=b.dataset.o;return grade(st.chosen===st.right)}
  if(a==='pickTok'){st.ans.push(+b.dataset.ti);return render()}
  if(a==='unpick'){st.ans.splice(+b.dataset.k,1);return render()}
  if(a==='checkBuild') return grade(st.ans.map(i=>st.toks[i]).join(' ')===st.toks.join(' '));
  if(a==='show'){R.shown=true;if(R.flip)speak(BYID[R.q[0]].en);return render()}
  if(a==='rate') return rate(+b.dataset.g);
  if(a==='askReset'){confirmReset=true;return render()}
  if(a==='cancelReset'){confirmReset=false;return render()}
  if(a==='doReset'){S={learned:{},xp:0,days:{},gram:{},texts:{},passed:{},lvl:null,open:{}};save();return go('home')}
});
if(TTS){try{speechSynthesis.getVoices()}catch(e){}}
if(TG){
  try{TG.ready();TG.expand();TG.setHeaderColor('#1d3760');TG.setBackgroundColor('#0f1f3a')}catch(e){}
  try{if(TG.isVersionAtLeast('7.7'))TG.disableVerticalSwipes()}catch(e){}
  try{TG.BackButton.onClick(()=>{L=null;go('home')})}catch(e){}
}
render();
if(CLOUD) cloudLoad();
</script>
